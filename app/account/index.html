<!doctype html>
<!-- SAVE AS: index.html · LOCATION: C:/MarvelApps/cmmgsite/app/account/index.html
     Settings & Membership (Scott's design list #9, 10/11 mockup): tabs Membership / Sports & Alerts / Display & Theme /
     App / Privacy. Discord is the master access authority: the plan shown comes from the member's Discord roles (relay);
     plans are the REAL Winible plans (Free / VIP $30 / Elite $45); billing happens on Winible (link, never card details
     here); no password (Discord sign-in). Sports + alert switches are the same settings the Alerts page uses
     (localStorage cmmg.alertset); sport theme = sports only (Scott 10/11). Delete my account & data -> relay "forget"
     (Google Play rule) at #delete. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings & Membership · CMMG Sports Edge</title><link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/app/manifest.webmanifest"><meta name="theme-color" content="#060d1a">
<link rel="icon" type="image/png" href="/img/lion_64.png"><link rel="apple-touch-icon" href="/img/apple_touch_180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CMMG">
<style>
.vhero { position:relative; overflow:hidden; border-radius:18px; border:1px solid var(--line); padding:22px; margin-bottom:12px;
  background:radial-gradient(500px 200px at 85% 40%, rgba(234,88,12,.22), transparent 70%), radial-gradient(400px 200px at 65% 80%, rgba(22,163,74,.18), transparent 70%), linear-gradient(100deg,#0b1730,#0f2a55 60%,#081325); }
.vhero h1 { font-size:clamp(24px, 4.2vw, 44px); font-style:italic; margin:0; line-height:1; } .vhero p { margin:8px 0 0; letter-spacing:.18em; font-weight:700; font-size:12px; color:#bfe6ff; }
.tabs2 { display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; scrollbar-width:none; } .tabs2::-webkit-scrollbar { display:none; }
.tabs2 button { flex:0 0 auto; display:flex; gap:6px; align-items:center; background:rgba(10,22,40,.6); border:1px solid var(--line); color:var(--dim); border-radius:12px; padding:9px 14px; font-weight:800; font-size:13px; }
.tabs2 button .ic { width:18px; height:18px; } .tabs2 button.on { background:linear-gradient(180deg,#2563eb,#1d4ed8); color:#fff; border-color:#3b82f6; box-shadow:0 0 14px rgba(59,130,246,.45); }
.g3 { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:12px; } .g3 > * { min-width:0; } @media (max-width:400px) { .g3 { grid-template-columns:1fr; } }
.mst { display:flex; gap:12px; align-items:center; margin-bottom:8px; } .mst .ic { width:44px; height:44px; color:#ffd700; filter:drop-shadow(0 0 8px rgba(255,215,0,.5)); }
.mst b { font-family:Saira; font-size:24px; color:#ffd700; } .act { font-size:11px; font-weight:900; color:#4ade80; border:1px solid rgba(74,222,128,.6); border-radius:6px; padding:2px 7px; margin-left:6px; }
.plans3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; } @media (max-width:560px) { .plans3 { grid-template-columns:1fr; } }
.pl { border:1px solid var(--line); border-radius:12px; padding:12px; background:rgba(5,12,24,.55); display:flex; flex-direction:column; }
.pl.cur { border-color:#3b82f6; box-shadow:0 0 18px rgba(59,130,246,.35); } .pl h4 { margin:0; font-family:Saira; font-size:16px; letter-spacing:.06em; }
.pl .pr { font-family:Saira; font-weight:800; font-size:22px; margin:2px 0 6px; } .pl .pr small { font-size:12px; color:var(--dim); font-family:Inter; }
.pl ul { list-style:none; padding:0; margin:0 0 10px; font-size:12px; color:#c9dcef; flex:1; } .pl li { margin:3px 0; }
.sg { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:8px; }
.sg label { display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px; border:1px solid var(--line); border-radius:12px; background:rgba(5,12,24,.55); font-size:12px; font-weight:800; cursor:pointer; }
.sg label .ic { width:26px; height:26px; color:#9fd2ff; } .sg input { display:none; } .sg label:has(input:checked) { border-color:#3b82f6; box-shadow:0 0 12px rgba(59,130,246,.35); }
.sg label:has(input:not(:checked)) { opacity:.5; }
.sw { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; font-size:13px; border-bottom:1px solid var(--line); }
.tog { position:relative; width:40px; height:22px; flex:0 0 auto; } .tog input { opacity:0; width:0; height:0; }
.tog i { position:absolute; inset:0; border-radius:99px; background:#334155; transition:.2s; } .tog i::before { content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; border-radius:50%; background:#fff; transition:.2s; }
.tog input:checked + i { background:#2563eb; box-shadow:0 0 10px rgba(37,99,235,.6); } .tog input:checked + i::before { transform:translateX(18px); }
.th { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:8px; }
.th button { height:74px; border-radius:12px; border:2px solid var(--line); color:#fff; font-weight:800; font-size:12px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:8px; }
.th button.on { border-color:#3b82f6; box-shadow:0 0 14px rgba(59,130,246,.5); }
</style></head>
<body>
<div class="layout wide">
  <main class="main">
    <div class="vhero"><h1>SETTINGS &amp; MEMBERSHIP</h1><p>YOUR ACCOUNT. YOUR ACCESS. YOUR EXPERIENCE.</p></div>
    <div class="tabs2" id="tabs"></div>
    <div id="body"></div>
  </main>
</div>
<script src="/js/cmmg.js"></script><script src="/js/icons.js"></script><script src="/js/icons-color.js"></script><script src="/js/shell.js"></script>
<script>
const E = CMMG.esc, $ = id => document.getElementById(id);
const FEATURES = [   // [label, plans that include it] - mirrors winible.com/cmmgsports
  ["Daily free card (1–2 plays)", ["free", "top5", "vip", "elite"]], ["Discord community chat", ["free", "top5", "vip", "elite"]],
  ["Top 5 picks", ["top5", "vip", "elite"]], ["The core card: 20+ plays a day + the Top 10", ["vip", "elite"]],
  ["DFS plays (PrizePicks / DraftKings)", ["vip", "elite"]], ["5 sport alert channels", ["vip", "elite"]], ["Live in-game drops", ["elite"]],
  ["Late plays near start time", ["elite"]], ["All 15+ sport channels · 45+ plays a day", ["elite"]], ["Arbitrage and middle alerts", ["elite"]]];
const PLANS = [["free", "FREE", "$0", "", ["Daily free card", "Daily market breakdowns", "Community chat"]],
  ["vip", "VIP", "$30", "/ month", ["20+ plays a day + Top 10", "DFS plays", "5 sport channels", "VIP receipts"]],
  ["elite", "ELITE", "$45", "/ month", ["Live in-game drops", "45+ plays a day", "All 15+ channels", "Arbitrage alerts"]]];
const SPORTS = ["NFL", "NCAAF", "NBA", "NCAAB", "WNBA", "MLB", "NHL", "MLS", "TENNIS", "UFC", "GOLF", "KBO"];
const TYPES = [["pick", "New picks (ICE / EDGE / FIRE)"], ["start", "Game start reminders"], ["result", "CMMG pick results (W/L/P)"], ["mine", "My tracked pick results"]];
const THEME_BG = { "": "linear-gradient(135deg,#0f2a55,#050b16)", fb: "linear-gradient(135deg,#14532d,#16a34a)", bb: "linear-gradient(135deg,#7c2d12,#ea580c)",
  base: "linear-gradient(135deg,#172554,#1d4ed8 60%,#7f1d1d)", hk: "linear-gradient(135deg,#1e3a8a,#93c5fd)", soc: "linear-gradient(135deg,#052e16,#22c55e)", ten: "linear-gradient(135deg,#365314,#84cc16)" };
let TAB = (location.hash || "").replace("#", "") || "member", SET = { types: {}, sports: {} };
if (TAB === "delete") TAB = "privacy";
if (!["member", "alerts", "display", "app", "privacy"].includes(TAB)) TAB = "member";
try { SET = JSON.parse(localStorage.getItem("cmmg.alertset") || "null") || SET; } catch (e) {}
SET.types = SET.types || {}; SET.sports = SET.sports || {};
const saveSet = () => { try { localStorage.setItem("cmmg.alertset", JSON.stringify(SET)); } catch (e) {} };
const on = (g, k) => SET[g][k] !== false;
const tog = (g, k) => `<span class="tog"><input type="checkbox" data-set="${g}" data-k="${k}" ${on(g, k) ? "checked" : ""}><i></i></span>`;
const ls = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

function draw() {
  const s = CMMG.session(), p = SHELL.plan(s), key = s ? p.key : "free";
  $("tabs").innerHTML = [["member", "star", "Membership"], ["alerts", "bell", "Sports & Alerts"], ["display", "gear", "Display & Theme"], ["app", "phone", "Get the App"], ["privacy", "shield", "Privacy"]]
    .map(([k, i, l]) => `<button data-tab="${k}" class="${k === TAB ? "on" : ""}">${ICON.ui(i)}${l}</button>`).join("");
  let h = "";
  if (TAB === "member") {
    h = `<div class="g3"><div class="box"><h3>MEMBERSHIP STATUS</h3>
        <div class="mst">${ICON.ui("star")}<div><b>CMMG ${E(s ? p.name.replace(" MEMBER", "") : "FREE")}</b>${s ? `<span class="act">ACTIVE</span>` : ""}<div class="game">${s ? "From your Discord roles · checked at sign-in" : "Sign in to see your plan"}</div></div></div>
        <ul class="check">${FEATURES.map(([l, w]) => `<li><span>${E(l)}</span><span>${w.indexOf(key) >= 0 ? "✅" : "🔒"}</span></li>`).join("")}</ul></div>
      <div class="box"><h3>DISCORD CONNECTION</h3>${s ? `<div style="display:flex;gap:12px;align-items:center">${s.me.avatar ? `<img src="${E(s.me.avatar)}" alt="" style="width:52px;height:52px;border-radius:50%">` : ""}
          <div><b style="font-size:17px">${E(s.me.name)}</b><div class="game" style="color:#86efac">● Connected${s.me.inServer ? " · in the CMMG server" : " · not in the CMMG server yet"}</div>
          <div class="game">Good until ${new Date(s.me.until).toLocaleString("en-US", { timeZone: "America/Chicago", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })} CT</div></div></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><a class="btn disc" style="text-decoration:none" href="${SHELL.DISCORD}">Open Discord</a><button class="btn ghost" data-signin>Refresh membership</button><button class="btn ghost" data-signout>Disconnect</button></div>`
        : `<p style="color:var(--dim);margin:0 0 10px">Not connected. Your plan comes from your CMMG Discord roles.</p><button class="btn disc" data-signin>Continue with Discord</button>`}
        <h3 style="margin-top:16px">DISCORD BENEFITS</h3><ul class="check" style="font-size:13px"><li><span>Sport channels and live drops (by plan)</span></li><li><span>Results posted every day, wins and losses</span></li><li><span>Strategy talk with the community</span></li></ul></div></div>
      <div class="box"><h3>MEMBERSHIP PLANS</h3><div class="plans3">${PLANS.map(([k, n, pr, per, li]) => `<div class="pl ${k === key ? "cur" : ""}"><h4>${n}</h4><div class="pr">${pr} <small>${per}</small></div>
        <ul>${li.map(x => `<li>✓ ${E(x)}</li>`).join("")}</ul>${k === key ? `<span class="btn ghost" style="text-align:center;opacity:.7">Current plan</span>` : k === "free" ? `<a class="btn ghost" style="text-align:center;text-decoration:none" href="${SHELL.DISCORD}">Join free</a>` : `<a class="btn ${k === "elite" ? "pro" : "ghost"} buy" style="text-align:center;text-decoration:none" href="${SHELL.UPGRADE}">${key === "free" ? "Get" : "Switch to"} ${n}</a>`}</div>`).join("")}</div>
        <p class="game buy" style="margin:10px 0 0">Billing, renewals and cancellations are on <a href="${SHELL.UPGRADE}" style="color:var(--ice)">Winible</a>. Weekly and 3-day options are there too.</p></div>`;
  } else if (TAB === "alerts") {
    h = `<div class="g3"><div class="box"><h3>SPORTS ACCESS</h3><p class="game" style="margin:0 0 10px">Tap the sports you follow. Alerts and the bell use this list.</p>
        <div class="sg">${SPORTS.map(x => `<label>${ICON.sport(x)}${x === "MLS" ? "SOCCER" : x}<input type="checkbox" data-set="sports" data-k="${x}" ${on("sports", x) ? "checked" : ""}></label>`).join("")}</div></div>
      <div class="box"><h3>NOTIFICATION SETTINGS</h3>${TYPES.map(([k, l]) => `<label class="sw"><span>${l}</span>${tog("types", k)}</label>`).join("")}
        <a class="btn ghost" style="display:inline-block;margin-top:10px;text-decoration:none" href="/app/alerts/">Open Alerts Center →</a></div></div>`;
  } else if (TAB === "display") {
    const cur = SHELL.theme() || "";
    h = `<div class="g3"><div class="box"><h3>SPORT THEME</h3><p class="game" style="margin:0 0 10px">The background behind every page. Sports only.</p>
        <div class="th">${[["", "CMMG classic"], ...Object.entries(SHELL.THEMES)].map(([k, n]) => `<button data-thm="${k}" class="${k === cur ? "on" : ""}" style="background:${THEME_BG[k]}">${E(n)}</button>`).join("")}</div></div>
      <div class="box"><h3>VIEW</h3><div class="field"><span>Pro Track opens in</span><select id="view"><option value="simple">Simple view (cards)</option><option value="advanced">Advanced view (table)</option></select></div>
        <label class="sw"><span>Show the lion loading screen</span><span class="tog"><input type="checkbox" id="spl" ${ls("cmmg.nosplash") === "1" ? "" : "checked"}><i></i></span></label>
        <p class="game" style="margin:8px 0 0">All times are Central Time (CT).</p></div></div>`;
  } else if (TAB === "app") {
    h = `<div class="box"><h3>GET THE APP</h3><p style="color:var(--dim);font-size:13px;margin:0 0 6px">CMMG works like an app on your phone, with no store needed.</p>
      <ul class="check"><li><span><b>iPhone (Safari):</b> tap Share <b>⬆</b>, then <b>Add to Home Screen</b>, then <b>Add</b>.</span></li>
        <li><span><b>Android (Chrome):</b> tap <b>Install app</b> at the top, or menu <b>⋮</b> → <b>Install app</b>.</span></li>
        <li><span><b>Computer (Chrome / Edge):</b> click the install icon at the right end of the address bar.</span></li></ul>
      ${matchMedia("(display-mode: standalone)").matches || navigator.standalone ? `<p style="color:#86efac;font-size:13px;margin:8px 0 0">✅ You're using the installed app.</p>` : ""}</div>`;
  } else {
    h = `<div class="box" id="privacy"><h3>PRIVACY</h3><p style="color:var(--dim);font-size:13px;margin:0">We keep your Discord ID, name and picture, plus the picks you track. Your tracker is only visible to you. We never see your Discord password, and the app never posts to Discord for you. <a href="/privacy/" style="color:var(--ice)">Privacy policy</a>.</p></div>
      <div class="box" id="delete"><h3>DELETE MY ACCOUNT &amp; DATA</h3><p style="color:var(--dim);font-size:13px;margin:0 0 10px">Removes everything CMMG stores about you: your tracked picks. Your Discord account and Discord roles are not changed. This can't be undone.</p>
      <div id="delBox">${s ? `<button class="btn ghost" id="delBtn" style="color:#fca5a5;border-color:rgba(252,165,165,.5)">Delete my account &amp; data</button>` : `<p style="font-size:13px;margin:0">Sign in with Discord first, then come back here to delete your data.</p><button class="btn disc" data-signin style="margin-top:8px">Continue with Discord</button>`}</div></div>`;
  }
  $("body").innerHTML = h;
  const v = $("view"); if (v) { v.value = ls("cmmg.view") || "simple"; v.onchange = () => { try { localStorage.setItem("cmmg.view", v.value); } catch (e) {} }; }
  const sp = $("spl"); if (sp) sp.onchange = () => { try { sp.checked ? localStorage.removeItem("cmmg.nosplash") : localStorage.setItem("cmmg.nosplash", "1"); } catch (e) {} };
}
document.addEventListener("change", e => { const i = e.target.closest("[data-set]"); if (i) { SET[i.dataset.set][i.dataset.k] = i.checked; saveSet(); } });
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab]"); if (t) { TAB = t.dataset.tab; history.replaceState(null, "", "#" + TAB); draw(); return; }
  const th = e.target.closest("[data-thm]"); if (th) { SHELL.setTheme(th.dataset.thm || null); draw(); return; }
  if (!e.target.closest("#delBtn")) return;
  const el = $("delBox");
  if (!el.dataset.sure) { el.dataset.sure = "1"; el.insertAdjacentHTML("beforeend", `<p style="color:#fca5a5;font-size:13px;margin:8px 0 0">Tap again to confirm. Your tracked picks will be deleted.</p>`); return; }
  const s = CMMG.session(); let j;
  try { j = await CMMG.relay({ task: "forget", session: s.token }); } catch (err) { j = { ok: false, error: "Couldn't reach CMMG. Try again." }; }
  if (j.ok) { CMMG.signOut(); el.innerHTML = `<p style="color:#86efac;margin:0">✅ Done. Your CMMG data is deleted and you're signed out.</p>`; SHELL.who(); }
  else el.insertAdjacentHTML("beforeend", `<p style="color:#fca5a5;font-size:13px">${E(j.error || "Couldn't delete. Try again.")}</p>`);
});
SHELL.mount("account"); draw();
</script>
</body></html>
