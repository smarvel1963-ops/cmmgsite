<!doctype html>
<!-- SAVE AS: index.html · LOCATION: C:/MarvelApps/cmmgsite/app/scores/index.html
     Live Scores (WEB_DESIGNS #12, Scott 10/11 mockup "REAL GAMES. REAL TIME."): KPIs (live / finals / upcoming / my tracked
     picks in action), filters (sport, status, search), a section per sport with LIVE / FINAL / UPCOMING games, score,
     clock, TV, records, the CMMG pick on that game (tier tag) and a "My pick" link, plus My Live Game Tracker on the
     right. Teams = our abbreviation + team-colour badges (no league / team logos - trademarks). Scores come from ESPN's
     public scoreboard read in the browser (CORS open); ESPN's terms are non-commercial -> swap to a licensed scores feed
     before the app-store launch (ACTIVE_TODO). Refreshes every 30 s while any game is live, else every 2 min. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Scores · CMMG Sports Edge</title><link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/app/manifest.webmanifest"><meta name="theme-color" content="#060d1a">
<link rel="icon" type="image/png" href="/img/lion_64.png"><link rel="apple-touch-icon" href="/img/apple_touch_180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CMMG">
<style>
.vhero { position:relative; overflow:hidden; border-radius:18px; border:1px solid var(--line); padding:24px; margin-bottom:14px;
  background:linear-gradient(90deg, rgba(5,11,22,.95) 40%, rgba(5,11,22,.4)), url(/img/splash.jpg) right 35% / 55% auto no-repeat, #070f1d; }
.vhero h1 { font-size:clamp(30px, 4.5vw, 52px); font-style:italic; margin:0; line-height:1; }
.vhero h1 span { background:linear-gradient(180deg,#fff3a8,#ffd700 60%,#c99400); -webkit-background-clip:text; background-clip:text; color:transparent; }
.vhero p { margin:8px 0 0; letter-spacing:.2em; font-weight:700; font-size:12px; color:#bfe6ff; }
.bar2 { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.bar2 select, .bar2 input { padding:9px; border-radius:9px; border:1px solid var(--line); background:#081325; color:var(--text); font:inherit; }
.bar2 input { flex:1; min-width:160px; }
.kp4 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; } @media (max-width:820px) { .kp4 { grid-template-columns:repeat(2,1fr); } }
.kp4 .kpi { display:flex; gap:12px; align-items:center; } .kp4 .kpi .ic { width:34px; height:34px; }
.kp4 .live .ic { color:#f87171; filter:drop-shadow(0 0 8px #ef4444); } .kp4 .fin .ic { color:#e8f4ff; } .kp4 .up .ic { color:#7fd8ff; } .kp4 .mine .ic { color:#ffd700; }
.sgrid { display:grid; grid-template-columns:minmax(0,2.2fr) minmax(260px,1fr); gap:14px; } @media (max-width:1100px) { .sgrid { grid-template-columns:1fr; } } .sgrid > * { min-width:0; }
.ssec { margin-bottom:14px; border-radius:16px; overflow:hidden; border:1px solid var(--line); background:linear-gradient(180deg, rgba(22,44,78,.5), rgba(8,17,32,.78)); }
.ssec .sh { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.ssec .sh b { font-family:Saira; font-style:italic; font-size:20px; letter-spacing:.04em; } .ssec .sh .ic { width:24px; height:24px; color:#fff; }
.ssec .sh small { font-weight:800; font-size:12px; letter-spacing:.06em; color:var(--dim); } .ssec .sh small.lv { color:#f87171; }
.gm { display:grid; grid-template-columns:84px minmax(0,1fr) minmax(0,auto); gap:12px; align-items:center; padding:10px 14px; border-bottom:1px solid rgba(127,216,255,.08); }
.gm:last-child { border-bottom:0; }
.st { font-weight:900; font-size:11px; letter-spacing:.08em; text-align:center; border-radius:7px; padding:4px 6px; }
.st.in { background:#dc2626; color:#fff; box-shadow:0 0 12px rgba(220,38,38,.6); } .st.post { background:#334155; color:#e2e8f0; } .st.pre { background:#0c2a4a; color:#7fd8ff; border:1px solid rgba(127,216,255,.4); }
.clk { font-size:12px; color:var(--dim); text-align:center; margin-top:4px; }
.mt { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:8px; align-items:center; min-width:0; }
.tm { display:flex; align-items:center; gap:8px; min-width:0; } .tm > div { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .tm.r { justify-content:flex-end; text-align:right; }
.tm span { font-size:11px; color:var(--dim); display:block; }
.sc { font-family:Saira; font-weight:800; font-size:24px; letter-spacing:.04em; white-space:nowrap; }
.sc .win { color:#fff; } .sc .lose { color:#7b93ad; }
.gx { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.gx .tvb { font-size:11px; color:var(--dim); display:flex; gap:4px; align-items:center; }
.gx .tag { font-size:11px; padding:3px 8px; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media (max-width:640px) { .gm { grid-template-columns:70px 1fr; } .gx { grid-column:1 / -1; flex-direction:row; justify-content:space-between; align-items:center; } .sc { font-size:20px; } }
.mine .row { display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; }
</style></head>
<body>
<div class="layout wide">
  <main class="main">
    <div class="vhero"><h1>LIVE <span>SCORES</span></h1><p>REAL GAMES. REAL TIME. YOUR PICKS IN ACTION.</p></div>
    <div class="bar2">
      <select id="fSport"><option value="">All sports</option></select>
      <select id="fSt"><option value="">All games</option><option value="in">Live</option><option value="post">Final</option><option value="pre">Upcoming</option></select>
      <input id="fQ" placeholder="Search teams">
    </div>
    <div class="kp4" id="kp"></div>
    <div class="sgrid">
      <div id="list"><div class="empty">Loading today's games…</div></div>
      <div>
        <div class="box mine"><h3>MY LIVE GAME TRACKER <a href="/app/tracker/" style="float:right;font-size:12px;color:var(--ice)">View all →</a></h3><div id="mine" style="color:var(--dim);font-size:13px">Sign in to see the picks you took.</div></div>
        <div class="box"><h3>CMMG PICKS IN ACTION</h3><div id="cmmg" style="color:var(--dim);font-size:13px">Loading…</div></div>
        <p style="color:var(--dim);font-size:12px">Scores update automatically. Times in CT.</p>
      </div>
    </div>
  </main>
</div>
<script src="/js/cmmg.js"></script><script src="/js/icons.js"></script><script src="/js/shell.js"></script>
<script>
const E = CMMG.esc, $ = id => document.getElementById(id);
const LEAGUES = [["NFL", "football/nfl"], ["NCAAF", "football/college-football"], ["NBA", "basketball/nba"], ["NCAAB", "basketball/mens-college-basketball"],
  ["WNBA", "basketball/wnba"], ["MLB", "baseball/mlb"], ["NHL", "hockey/nhl"], ["MLS", "soccer/usa.1"]];
const TIER_ICON = { ICE: ICON.tier("ICE"), EDGE: ICON.tier("EDGE"), FIRE: ICON.tier("FIRE") };
let GAMES = [], PICKS = [], MINE = [], timer = null;
const ctDay = (d = new Date()) => d.toLocaleDateString("en-CA", { timeZone: "America/Chicago" }).replace(/-/g, "");
const ct = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString("en-US", { timeZone: "America/Chicago", hour: "numeric", minute: "2-digit" }) + " CT"; };
const hex = c => /^[0-9a-f]{6}$/i.test(c || "") ? "#" + c : "#334155";
const lum = c => { const n = parseInt((c || "334155").slice(0, 6), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000; };
const badge = t => `<span class="tb" style="background:${hex(t.color)};color:${lum(t.color) > 150 ? "#0b1220" : "#fff"};border-color:${hex(t.alt)}">${E(t.abbr)}</span>`;
const norm = s => String(s || "").toLowerCase();

async function fetchLeague([key, path]) {
  const extra = key === "NCAAF" ? "&groups=80&limit=300" : key === "NCAAB" ? "&groups=50&limit=400" : "";
  try {
    const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${path}/scoreboard?dates=${ctDay()}${extra}`);
    const j = await r.json();
    return (j.events || []).map(e => {
      const c = (e.competitions || [{}])[0], st = (e.status || c.status || {}).type || {};
      const teams = (c.competitors || []).map(t => ({ side: t.homeAway, abbr: t.team?.abbreviation || "", name: t.team?.displayName || "", short: t.team?.shortDisplayName || "",
        color: t.team?.color || "", alt: t.team?.alternateColor || "", score: t.score, rec: (t.records || [{}])[0]?.summary || "", win: t.winner }))
        .sort((a, b) => (a.side === "away" ? 0 : 1) - (b.side === "away" ? 0 : 1));
      const tv = [...new Set((c.broadcasts || []).flatMap(b => b.names || []))].slice(0, 2).join(", ");
      return { league: key, id: e.id, date: e.date, state: st.state || "pre", detail: st.shortDetail || "", teams, tv };
    });
  } catch (e) { return []; }
}

function pickFor(g) {   // the CMMG pick on this game (visible or locked stub - locked shows only the tier)
  return PICKS.find(p => p.sport === g.league && (p.locked ? false : g.teams.every(t => norm(p.game).includes(norm(t.short)) || norm(p.game).includes(norm(t.name)))))
    || null;
}

function draw() {
  const sp = $("fSport").value, sf = $("fSt").value, q = norm($("fQ").value);
  const vis = GAMES.filter(g => (!sp || g.league === sp) && (!sf || g.state === sf) && (!q || g.teams.some(t => norm(t.name).includes(q) || norm(t.abbr).includes(q))));
  const n = s => GAMES.filter(g => g.state === s).length, live = MINE.filter(m => m.g && m.g.state === "in").length;
  $("kp").innerHTML = `<div class="kpi live">${ICON.ui("target")}<div><div class="l">LIVE GAMES</div><div class="n">${n("in")}</div></div></div>
    <div class="kpi fin">${ICON.ui("check")}<div><div class="l">FINALS TODAY</div><div class="n">${n("post")}</div></div></div>
    <div class="kpi up">${ICON.ui("clock")}<div><div class="l">UPCOMING</div><div class="n">${n("pre")}</div></div></div>
    <div class="kpi mine">${ICON.ui("star")}<div><div class="l">MY PICKS PLAYING</div><div class="n">${live}</div></div></div>`;
  const order = { in: 0, pre: 1, post: 2 };
  const secs = LEAGUES.map(([k]) => [k, vis.filter(g => g.league === k).sort((a, b) => order[a.state] - order[b.state] || a.date.localeCompare(b.date))]).filter(([, gs]) => gs.length);
  if (!secs.length) { $("list").innerHTML = `<div class="empty">${GAMES.length ? "No games match these filters." : "No games on today's schedule."}</div>`; return; }
  $("list").innerHTML = secs.map(([k, gs]) => {
    const c = s => gs.filter(g => g.state === s).length;
    return `<div class="ssec"><div class="sh">${ICON.sport(k)}<b>${E(k)}</b>${c("in") ? `<small class="lv">${c("in")} LIVE</small>` : ""}<small>${c("post")} FINAL</small><small>${c("pre")} UPCOMING</small></div>`
      + gs.map(g => {
        const [a, h] = g.teams, p = pickFor(g), mine = MINE.find(m => m.g && m.g.id === g.id);
        const hasScore = g.state !== "pre" && a && h;
        return `<div class="gm"><div><div class="st ${g.state}">${g.state === "in" ? "LIVE" : g.state === "post" ? "FINAL" : "UPCOMING"}</div>
            <div class="clk">${g.state === "pre" ? ct(g.date) : E(g.detail)}</div></div>
          <div class="mt"><div class="tm">${a ? badge(a) : ""}<div>${E(a?.short || "")}<span>${E(a?.rec || "")}</span></div></div>
            <div class="sc">${hasScore ? `<span class="${a.win ? "win" : h.win ? "lose" : ""}">${E(a.score)}</span> - <span class="${h.win ? "win" : a.win ? "lose" : ""}">${E(h.score)}</span>` : "vs"}</div>
            <div class="tm r"><div>${E(h?.short || "")}<span>${E(h?.rec || "")}</span></div>${h ? badge(h) : ""}</div></div>
          <div class="gx">${g.tv ? `<span class="tvb">${ICON.ui("tv")}${E(g.tv)}</span>` : ""}
            ${p ? `<span class="tag ${E(p.tier)}">${TIER_ICON[p.tier] || ""} ${E(p.bet)}</span>` : ""}
            ${mine ? `<a class="btn go" style="padding:5px 10px;font-size:12px;text-decoration:none" href="/app/tracker/">My pick</a>` : ""}</div></div>`;
      }).join("") + `</div>`;
  }).join("");
  $("mine").innerHTML = !CMMG.session() ? "Sign in to see the picks you took." : MINE.length ? MINE.map(m => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)">
      <div><b style="color:var(--text)">${E(m.bet)}</b><div class="game">${E(m.sport)} · ${m.g ? (m.g.state === "pre" ? ct(m.g.date) : E(m.g.detail)) : "—"}</div></div>
      <div class="sc" style="font-size:16px">${m.g && m.g.state !== "pre" ? `${E(m.g.teams[0]?.score)}-${E(m.g.teams[1]?.score)}` : ""}</div>
      <span class="tag ${E(m.tier)}" style="font-size:10px">${TIER_ICON[m.tier] || ""} ${E(m.tier)}</span></div>`).join("") : "No picks tracked today. Tap “I Took This Pick” on Today's Picks.";
  const open = PICKS.filter(p => !p.locked);
  $("cmmg").innerHTML = open.length ? open.slice(0, 8).map(p => { const g = GAMES.find(x => x.league === p.sport && pickFor(x) === p);
      return `<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)"><span>${TIER_ICON[p.tier] || ""} <b style="color:var(--text)">${E(p.bet)}</b></span>
      <span>${g ? (g.state === "pre" ? ct(g.date) : `${E(g.teams[0]?.score)}-${E(g.teams[1]?.score)} · ${E(g.detail)}`) : ct(p.time)}</span></div>`; }).join("")
    : `${PICKS.length} picks today${PICKS.length ? " · members-only details" : ""}. <a href="/app/" style="color:var(--ice)">Today's Picks →</a>`;
}

async function load() {
  const s = CMMG.session();
  const [lists, pj, mj] = await Promise.all([Promise.all(LEAGUES.map(fetchLeague)),
    CMMG.relay({ task: "picks", session: s ? s.token : undefined }).catch(() => ({})),
    s ? CMMG.relay({ task: "mytracker", session: s.token }).catch(() => ({})) : Promise.resolve({})]);
  GAMES = lists.flat();
  PICKS = pj && pj.ok ? pj.picks || [] : [];
  const today = new Date().toLocaleDateString("en-CA", { timeZone: "America/Chicago" });
  MINE = (mj && mj.ok ? mj.rows || [] : []).filter(r => (r.date || "") === today || r.result === "PENDING").map(r => ({ ...r,
    g: GAMES.find(g => g.league === r.sport && g.teams.every(t => norm(r.game).includes(norm(t.short)) || norm(r.game).includes(norm(t.name)))) }));
  const have = new Set(GAMES.map(g => g.league)), cur = $("fSport").value;
  $("fSport").innerHTML = `<option value="">All sports</option>` + LEAGUES.filter(([k]) => have.has(k)).map(([k]) => `<option ${k === cur ? "selected" : ""}>${k}</option>`).join("");
  draw();
  clearTimeout(timer); timer = setTimeout(load, GAMES.some(g => g.state === "in") ? 30000 : 120000);
}
["fSport", "fSt"].forEach(id => $(id).addEventListener("change", draw)); $("fQ").addEventListener("input", draw);
SHELL.mount("scores"); load();
</script>
</body></html>
