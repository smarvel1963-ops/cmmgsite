<!doctype html>
<!-- SAVE AS: index.html · LOCATION: C:/MarvelApps/cmmgsite/app/ufc/index.html
     UFC (Scott 10/12: "build ufc page"). ESPN's public MMA scoreboard + calendar (no key): EVENT = the card on now or
     next (name, venue, CT start, countdown, fight count); OUR PICKS = today's Pro Track UFC picks (relay task "picks",
     Pro Track masking - a locked pick never carries the fighter or price) on their bout; FIGHT CARD = every bout, main
     event first, 5-round bouts flagged, each with weight class, records, flags and its state (CT time / LIVE round /
     winner + method + round + time); UP NEXT = the next events. Our picks' results come from the feed's own grade. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UFC · CMMG Sports Edge</title><link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/app/manifest.webmanifest"><meta name="theme-color" content="#060d1a">
<link rel="icon" type="image/png" href="/img/lion_64.png"><link rel="apple-touch-icon" href="/img/apple_touch_180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CMMG">
<style>
:root { --oct:#ffd700; --blood:#e11d48; }
.evh { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px; align-items:center; padding:18px 20px; border-radius:18px; margin-bottom:16px; position:relative; overflow:hidden;
  border:1px solid rgba(225,29,72,.5); background:radial-gradient(120% 140% at 100% 0%, rgba(225,29,72,.18), transparent 55%), linear-gradient(180deg, rgba(22,44,78,.6), rgba(8,17,32,.9)); }
.evh::before { content:""; position:absolute; right:-40px; top:-40px; width:200px; height:200px; opacity:.08;
  background:conic-gradient(from 22.5deg, #fff 0 12.5%, transparent 0 25%, #fff 0 37.5%, transparent 0 50%, #fff 0 62.5%, transparent 0 75%, #fff 0 87.5%, transparent 0);
  clip-path:polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
.evh .lb { font-size:11px; font-weight:900; letter-spacing:.18em; color:var(--blood); } .evh .en { font-family:Saira; font-style:italic; font-weight:800; font-size:28px; line-height:1.1; margin-top:6px; }
.evh .meta { color:var(--dim); font-size:13px; margin-top:6px; } .evh .cd { text-align:center; } .evh .cd b { display:block; font-family:Saira; font-weight:800; font-size:34px; line-height:1; color:var(--oct); white-space:nowrap; font-variant-numeric:tabular-nums; }
.evh .cd span { font-size:11px; font-weight:800; letter-spacing:.14em; color:var(--dim); }
.sech { display:flex; align-items:center; gap:10px; margin:18px 0 10px; font-family:Saira; font-style:italic; font-weight:800; font-size:20px; letter-spacing:.04em; } .sech small { font-family:Inter; font-style:normal; font-size:12px; color:var(--dim); font-weight:700; letter-spacing:0; }
/* a bout: red corner | vs | blue corner */
.bout { display:grid; grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr); gap:12px; align-items:center; padding:12px 14px; border-radius:14px; margin-bottom:10px;
  border:1px solid var(--line); background:linear-gradient(90deg, rgba(225,29,72,.08), rgba(8,17,32,.82) 30%, rgba(8,17,32,.82) 70%, rgba(37,99,235,.08)); }
.bout.main { border-color:rgba(255,215,0,.55); box-shadow:0 0 16px rgba(255,215,0,.12); } .bout.ours { border-color:rgba(0,191,99,.6); }
.f { display:flex; align-items:center; gap:10px; min-width:0; } .f.r { flex-direction:row-reverse; text-align:right; }
.f .nm { min-width:0; } .f .nm b { display:block; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .f .nm small { color:var(--dim); font-size:12px; font-weight:700; }
.f img { border-radius:2px; flex:none; } .f.w .nm b { color:#4ade80; } .f.w .nm b::after { content:" ✓"; } .f.l { opacity:.6; }
.mid { text-align:center; } .mid .wc { font-size:11px; font-weight:900; letter-spacing:.08em; color:var(--dim); text-transform:uppercase; }
.mid .st { font-family:Saira; font-weight:800; font-size:15px; margin-top:4px; } .mid .st.live { color:#f87171; } .mid .how { font-size:11px; color:var(--dim); margin-top:2px; }
.mid .rd { display:inline-block; margin-top:4px; font-size:10px; font-weight:900; letter-spacing:.1em; padding:2px 6px; border-radius:5px; background:rgba(255,215,0,.15); color:var(--oct); }
.pk3 { grid-column:1 / -1; display:flex; gap:8px; align-items:center; flex-wrap:wrap; border-top:1px solid rgba(127,216,255,.1); padding-top:10px; font-size:13px; }
.pk3 .b { font-family:Saira; font-weight:800; font-size:17px; } .pk3 .o { color:var(--dim); }
.rb { display:inline-block; min-width:30px; text-align:center; font-weight:900; border-radius:7px; padding:4px 8px; font-family:Saira, Inter; font-size:12px; margin-left:auto; }
.rb.WIN { background:#16a34a; color:#04140a; } .rb.LOSS { background:#dc2626; color:#fff; } .rb.PUSH, .rb.VOID { background:#64748b; color:#fff; }
.lockc { padding:14px; border-radius:14px; border:1px solid var(--line); background:rgba(10,22,40,.6); display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
.calr { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; }
.calr div { padding:10px 12px; border-radius:10px; background:rgba(10,22,40,.6); border:1px solid var(--line); } .calr b { display:block; font-size:14px; } .calr span { font-size:12px; color:var(--dim); }
@media (max-width:640px) { .bout { grid-template-columns:minmax(0,1fr) 84px minmax(0,1fr); gap:8px; padding:10px; } .f img { display:none; } .f .nm b { font-size:14px; }
  .evh { grid-template-columns:1fr; } .evh .cd { text-align:left; } .evh .en { font-size:22px; } }
</style></head>
<body>
<div class="layout wide">
  <main class="main">
    <div class="vhero"><h1>UFC</h1><p>FIGHT NIGHT. EVERY BOUT. OUR PICKS.</p></div>
    <div id="ev"></div>
    <div id="ours"></div>
    <div id="card"><div class="empty">Loading…</div></div>
    <div id="cal"></div>
  </main>
</div>
<script src="/js/cmmg.js"></script><script src="/js/icons.js"></script><script src="/js/icons-color.js"></script><script src="/js/shell.js"></script>
<script>
const E = CMMG.esc, $ = id => document.getElementById(id);
const CT = { timeZone: "America/Chicago" };
const when = t => { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleString("en-US", { ...CT, weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " CT"; };
const ct = t => { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleTimeString("en-US", { ...CT, hour: "numeric", minute: "2-digit" }); };
const dshort = t => { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleDateString("en-US", { ...CT, month: "short", day: "numeric" }); };
const odds = o => o == null || o === "" ? "" : Number(o) > 0 ? "+" + o : String(o);
const fmtCd = s => { if (s <= 0) return "FIGHT NIGHT"; const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return d ? `${d}d ${h}h ${String(m).padStart(2, "0")}m` : `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}`; };
const fold = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const last = s => fold(s).trim().split(/\s+/).pop();
let EV = null, CAL = [], PICKS = [];

// ESPN's finish text: "Unofficial Winner Kotko" / "...Submission" / "...Decision - Unanimous" -> KO/TKO, SUB, DEC
function method(c) {
  const t = (c.details || []).map(d => d.type?.text || "").find(x => /^Unofficial Winner/i.test(x)) || "";
  const m = t.replace(/^Unofficial Winner\s*/i, "");
  if (/kotko|ko|tko/i.test(m)) return "KO/TKO"; if (/sub/i.test(m)) return "Submission"; if (/dec/i.test(m)) return m.replace(/decision\s*-?\s*/i, "Decision ").trim();
  const st = c.status || {}, reg = c.format?.regulation?.periods || 3;
  return st.type?.completed && st.period === reg && st.displayClock === "5:00" ? "Decision" : "";
}
function bout(c, i, n, pick) {
  const st = c.status?.type || {}, live = st.state === "in", done = st.state === "post";
  const fs = (c.competitors || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  const won = fs.find(f => f.winner);
  const fighter = (f, right) => { const a = f.athlete || {}, rec = (f.records || [])[0]?.summary;
    return `<div class="f ${right ? "r" : ""} ${done && won ? (f.winner ? "w" : "l") : ""}">${a.flag?.href ? `<img src="${E(a.flag.href)}" alt="" width="26" height="18" loading="lazy">` : ""}
      <div class="nm"><b>${E(a.displayName || "TBD")}</b><small>${E(rec || "")}</small></div></div>`; };
  const rounds = c.format?.regulation?.periods || 3, isMain = i === 0;
  const mid = done ? `<div class="st">${won ? E(last(won.athlete?.displayName).replace(/^./, x => x.toUpperCase())) : "Draw / NC"}</div><div class="how">${E([method(c), c.status?.period ? "R" + c.status.period : "", c.status?.displayClock && c.status.displayClock !== "-" ? c.status.displayClock : ""].filter(Boolean).join(" · "))}</div>`
    : live ? `<div class="st live">LIVE · R${E(c.status?.period || 1)}</div><div class="how">${E(c.status?.displayClock || "")}</div>` : `<div class="st">${ct(c.date)}</div><div class="how">CT</div>`;
  return `<div class="bout ${isMain ? "main" : ""} ${pick ? "ours" : ""}">${fighter(fs[0] || {}, false)}
    <div class="mid"><div class="wc">${E(c.type?.abbreviation || "")}</div>${mid}${isMain ? `<span class="rd">MAIN EVENT${rounds === 5 ? " · 5 RDS" : ""}</span>` : rounds === 5 ? '<span class="rd">5 RDS</span>' : ""}</div>
    ${fighter(fs[1] || {}, true)}
    ${pick ? `<div class="pk3"><span class="tag ${E(pick.tier)}">${ICON.tier(pick.tier)} ${E(pick.tier || "")}</span><span class="b">${E(pick.bet)}</span><span class="o">${odds(pick.odds)}${pick.book ? " · " + E(pick.book) : ""}</span>${pick.result ? `<span class="rb ${E(pick.result)}">${E(pick.result)}</span>` : ""}</div>` : ""}</div>`;
}
// our pick -> its bout: both fighters' last names in the pick's game text
function boutFor(p) {
  const g = fold(p.game);
  return ((EV && EV.competitions) || []).find(c => (c.competitors || []).length === 2 && c.competitors.every(k => g.includes(last(k.athlete?.displayName)))) || null;
}
function draw() {
  if (!EV) { $("ev").innerHTML = ""; $("card").innerHTML = `<div class="empty">No UFC event on the calendar right now.</div>`; drawCal(); return; }
  const bouts = (EV.competitions || []).slice().reverse();              // ESPN lists prelims first: main event on top
  const v = (EV.venues || [])[0] || {}, start = EV.date, live = bouts.some(c => c.status?.type?.state === "in"), done = bouts.every(c => c.status?.type?.state === "post");
  $("ev").innerHTML = `<div class="evh"><div style="min-width:0;position:relative"><div class="lb">${done ? "LAST EVENT" : live ? "LIVE NOW" : "NEXT EVENT"}</div><div class="en">${E(EV.name)}</div>
    <div class="meta">${E([v.fullName, [v.address?.city, v.address?.state || v.address?.country].filter(Boolean).join(", ")].filter(Boolean).join(" · "))}${v.fullName ? " · " : ""}${when(start)} · ${bouts.length} fight${bouts.length === 1 ? "" : "s"}</div></div>
    <div class="cd"><b data-start="${E(done ? "" : start)}">${done ? "FINAL" : fmtCd(Math.round((new Date(start) - Date.now()) / 1000))}</b><span>${done ? "RESULTS BELOW" : live ? "UNDER WAY" : "TO FIRST BOUT"}</span></div></div>`;
  const up = PICKS.filter(p => /^(UFC|MMA)$/i.test(String(p.sport)));
  $("ours").innerHTML = up.length ? `<div class="sech">OUR PICKS<small>${up.length} · from Pro Track</small></div>` + up.map(p => {
      if (p.locked) return `<div class="lockc">${ICON.ui("lock")} <b>Members-only UFC pick</b> <span class="game">${ct(p.time)} CT</span>${SHELL.STORE ? "" : `<a class="btn pro" style="text-decoration:none;margin-left:auto" href="${SHELL.UPGRADE}">Unlock</a>`}</div>`;
      const c = boutFor(p); return c ? bout(c, -1, 0, p) : `<div class="bout ours"><div class="pk3" style="border:0;padding:0"><span class="tag ${E(p.tier)}">${ICON.tier(p.tier)} ${E(p.tier || "")}</span><span class="b">${E(p.bet)}</span><span class="o">${E(p.game)} · ${odds(p.odds)}</span>${p.result ? `<span class="rb ${E(p.result)}">${E(p.result)}</span>` : ""}</div></div>`; }).join("") : "";
  $("card").innerHTML = `<div class="sech">FIGHT CARD<small>${bouts.length} bouts · main event first</small></div>` + bouts.map((c, i) => bout(c, i, bouts.length, null)).join("");
  drawCal();
}
function drawCal() {
  const up = CAL.filter(c => Date.parse(c.startDate) > Date.now() && (!EV || c.label !== EV.name)).slice(0, 4);
  $("cal").innerHTML = up.length ? `<div class="box"><h3>UP NEXT</h3><div class="calr">${up.map(c => `<div><b>${E(c.label)}</b><span>${when(c.startDate)}</span></div>`).join("")}</div></div>` : "";
}
async function load() {
  let j = null; try { j = await (await fetch("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard")).json(); } catch (e) {}
  CAL = (j && j.leagues && j.leagues[0] && j.leagues[0].calendar) || [];
  EV = (j && (j.events || [])[0]) || null;
  // the scoreboard can hold an old card between events: if it's long finished, show the next one on the calendar
  const done = EV && (EV.competitions || []).every(c => c.status?.type?.state === "post");
  const nxt = CAL.find(c => Date.parse(c.endDate || c.startDate) > Date.now());
  if ((!EV || (done && Date.now() - Date.parse(EV.date) > 36 * 3600e3)) && nxt) {
    const d = new Date(nxt.startDate).toLocaleDateString("en-CA", CT).replace(/-/g, "");
    try { const j2 = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard?dates=${d}`)).json(); EV = (j2.events || []).find(e => e.name === nxt.label) || (j2.events || [])[0] || EV; } catch (e) {}
  }
  try { const r = await CMMG.relay({ task: "picks", session: CMMG.session()?.token }); PICKS = r && r.ok ? r.picks || [] : []; } catch (e) { PICKS = []; }
  draw();
}
setInterval(() => { const b = document.querySelector("[data-start]"); if (b && b.dataset.start) b.textContent = fmtCd(Math.round((new Date(b.dataset.start) - Date.now()) / 1000)); }, 1000);
setInterval(load, 60000);
SHELL.mount("ufc"); load();
</script>
</body></html>
