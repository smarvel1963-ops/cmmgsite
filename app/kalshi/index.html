<script>
const E = CMMG.esc, $ = id => document.getElementById(id);
const N = v => v == null || v === "" ? null : (isFinite(+v) ? +v : null);    // feed numbers stay numbers; missing stays missing
const num = (v, d = 0) => { const x = N(v); return x == null ? "—" : x.toLocaleString("en-US", { maximumFractionDigits: d }); };
const odds = o => { const x = N(o); return x == null || o === "" ? "—" : x > 0 ? "+" + x : String(x); };
const usd = v => { const x = N(v); return x == null ? "—" : (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
const sgn = v => { const x = N(v); return x == null ? "—" : (x > 0 ? "+" : "") + usd(x); };
const cls = v => { const x = N(v); return x > 0 ? "pos" : x < 0 ? "neg" : ""; };
const pct = v => { const x = N(v); return x == null ? "—" : (x * 100).toFixed(1) + "%"; };
// MasterHub writes pick times in Central time without a zone ("2026-11-10T20:23")
const when = t => { const m = String(t || "").match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/); if (!m) return ["", ""];
  const mo = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][Number(m[2]) - 1], h = Number(m[4]);
  return [`${mo} ${Number(m[3])}`, `${h % 12 || 12}:${m[5]} ${h < 12 ? "AM" : "PM"} CT`]; };
const dayLbl = d => /^\d{4}-\d\d-\d\d$/.test(String(d || "")) ? new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" }) : E(d);
const recTxt = r => !r || !N(r.graded) ? "—" : `${num(r.w)}-${num(r.l)}`;
const ago = iso => { const t = Date.parse(iso || ""); if (!t) return "never"; const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; };
const VNAME = { KALSHI: "KALSHI", POLY: "POLYMARKET" };

function gate(msg, btn) {
  LAST = null;
  $("gate").innerHTML = `<div class="${btn ? "signbar" : "soonbar"}"><span>${msg}</span>${btn ? '<button class="btn disc" data-signin>Continue with Discord</button>' : ""}</div>`;
  ["status", "tiles", "chart", "rows", "boards", "both", "sizing", "gaps", "days", "note"].forEach(id => { $(id).innerHTML = ""; });
}
function badge(st, res) {
  if (st === "NO_FILL") return '<span class="rb NOFILL">NO FILL</span>';
  if (res) return `<span class="rb ${E(res)}">${E(res)}</span>`;
  return st === "PARTIAL" ? '<span class="rb PART">PART</span>' : '<span class="rb OPEN">OPEN</span>';
}
function gapTxt(g) { const x = N(g); return x == null ? "" : x === 0 ? "same line" : `${num(x, 1)} pt better`; }
function venueLine(name, side, k, gap, o, dep, st, why, res, pl, best) {
  if (!st) return "";
  const body = st === "NO_FILL" ? `<span class="why">${E(why)}</span>`
    : `${N(k) != null ? `<b>${E(side)} ${num(k, 1)}</b> at ` : ""}<b>${odds(o)}</b>${N(gap) != null || N(dep) != null ? ` <span class="why">(${[gapTxt(gap), N(dep) != null ? `$${num(dep)} in book within 5¢` : ""].filter(Boolean).join(" · ")})</span>` : ""}`
      + (res ? ` <span class="rb ${E(res)}">${E(res)}</span> <span class="${cls(pl)}">${sgn(pl)}</span>` : "");
  return `<div class="vline ${best ? "best" : ""}"><span class="vtag">${VNAME[name]}</span>${body}${best ? '<span class="btag">BEST</span>' : ""}</div>`;
}
// LIVE SCORES (Scott 11/10: "each of those lines should have live score and bet be green or red if winning or losing").
// ESPN's public scoreboard (no key), every 30 s, the same source as the Lives pages. Display only - the paper record is
// graded off each venue's own settlement, never off this. Totals: a straight-line pace from the score and clock (a guide,
// not a prediction); MLs: who is leading.
const ESPN = { NBA: ["basketball/nba", 48, 12, 4, ""], NCAAB: ["basketball/mens-college-basketball", 40, 20, 2, "&groups=50&limit=400"],
  WNBA: ["basketball/wnba", 40, 10, 4, ""], NFL: ["football/nfl", 60, 15, 4, ""], NCAAF: ["football/college-football", 60, 15, 4, "&groups=80&limit=300"],
  NHL: ["hockey/nhl", 60, 20, 3, ""] };
let EV = {}, LAST = null;
const nm = x => String(x || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
const ymd = t => String(t || "").slice(0, 10).replace(/-/g, "");
async function scores(k) {
  const want = new Set();
  const recent = new Set([0, 1].map(dd => new Date(Date.now() - dd * 86400000).toLocaleDateString("en-CA", { timeZone: "America/Chicago" }).replace(/-/g, "")));
  [...(k.rows || []), ...((k.boards || {}).rows || [])].forEach(r => {
    if (ESPN[r.lg] && r.t && recent.has(ymd(r.t)) && !(r.res || r.pres || r.kres)) want.add(r.lg + "|" + ymd(r.t)); });
  await Promise.all([...want].map(async key => {
    const [lg, d] = key.split("|"), x = ESPN[lg];
    try { const j = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/${x[0]}/scoreboard?dates=${d}${x[4]}`)).json(); EV[key] = j.events || []; } catch (e) {}
  }));
}
// how well a team's ESPN names fit a text: the longest name found in it (full name beats mascot or city)
const fit = (c, txt) => Math.max(0, ...[c.team.displayName, c.team.shortDisplayName, c.team.location, c.team.name]
  .filter(Boolean).map(n => (txt.includes(nm(n)) ? nm(n).length + (n === c.team.displayName ? 100 : 0) : 0)));
function evFor(lg, t, game) {       // both teams must fit; the best-fitting game wins (never the first "Bears vs Eagles")
  const g = nm(game);
  let best = null, bs = 0;
  for (const e of EV[lg + "|" + ymd(t)] || []) {
    const cs = ((e.competitions || [])[0] || {}).competitors || [];
    if (cs.length !== 2) continue;
    const a = fit(cs[0], g), b = fit(cs[1], g);
    if (a && b && a + b > bs) { best = e; bs = a + b; }
  }
  return best;
}
function betOf(r) {          // {kind, side, line} or {kind:"ML", team}
  if (r.side && N(r.line) != null) return { kind: "TOTAL", side: String(r.side).toUpperCase(), line: N(r.line) };
  const m = String(r.bet || "").match(/^(over|under)\s+([\d.]+)$/i);
  if (m) return { kind: "TOTAL", side: m[1].toUpperCase(), line: Number(m[2]) };
  const ml = String(r.bet || "").match(/^(.+)\s+ML$/i);
  return ml ? { kind: "ML", team: ml[1] } : null;
}
function liveOf(r) { try { return liveOf0(r); } catch (e) { return { cls: "", html: "" }; } }   // one odd ESPN event never breaks the page
function liveOf0(r) {          // {cls: "lw"|"ll"|"", html}
  const b = betOf(r), x = ESPN[r.lg], ev = b && x ? evFor(r.lg, r.t, r.game) : null;
  // a total is judged at the line the paper position actually holds: the venue the row takes, else the logged line
  let vname = "";
  if (b && b.kind === "TOTAL") {
    const vk = r.best === "POLY" ? r.pk : r.k;
    if (N(vk) != null && (r.best || r.st === "FILLED" || r.st === "PARTIAL" || r.kst === "FILLED")) {
      b.line = N(vk); vname = r.best === "POLY" ? "Polymarket " : "Kalshi "; }
  }
  if (!ev) return { cls: "", html: "" };
  const st = ev.status || {}, state = (st.type || {}).state, cs = ev.competitions[0].competitors || [];
  const away = cs.find(c => c.homeAway === "away") || cs[0], home = cs.find(c => c.homeAway === "home") || cs[1];
  const pa = Number(away.score) || 0, ph = Number(home.score) || 0, pts = pa + ph;
  const score = `<span class="sc">${E(away.team.abbreviation || away.team.shortDisplayName)} ${num(pa)} - ${num(ph)} ${E(home.team.abbreviation || home.team.shortDisplayName)}</span>`;
  if (state === "pre") return { cls: "", html: `<div class="live"><span class="pre">${E((st.type || {}).shortDetail || "not started")}</span></div>` };
  let win = null, label = "", extra = "";
  if (b.kind === "TOTAL") {
    if (state === "post") { win = pts === b.line ? null : (b.side === "OVER") === (pts > b.line); label = win == null ? "PUSH" : win ? "WON" : "LOST"; }
    else if (pts > b.line) { win = b.side === "OVER"; label = win ? "CASHED" : "LOST"; }
    else {
      const [, reg, plen, nper] = x, p = Number(st.period) || 1, c = String(st.displayClock || "0:00").split(":").map(Number);
      const left = c.length === 2 ? c[0] + c[1] / 60 : (c[0] || 0) / 60;
      const el = p > nper ? reg : Math.min(reg, (p - 1) * plen + Math.max(0, plen - left));
      if (el > 1) { const proj = pts * reg / el; win = b.side === "OVER" ? proj >= b.line : proj < b.line; label = win ? "ON PACE" : "OFF PACE"; extra = ` · pace ${num(proj, 1)}`; }
    }
    extra = ` · total ${num(pts)} vs ${E(vname)}${num(b.line, 1)}` + extra;
  } else {
    const fa = fit(away, nm(b.team)), fh = fit(home, nm(b.team));
    const ours = fa === fh ? null : fa > fh ? away : home;            // a tie (e.g. two "Wildcats") = no colour
    if (ours) { const theirs = ours === away ? home : away, d = (Number(ours.score) || 0) - (Number(theirs.score) || 0);
      win = d === 0 ? null : d > 0; label = state === "post" ? (win == null ? "TIED" : win ? "WON" : "LOST") : (win == null ? "TIED" : win ? "LEADING" : "TRAILING"); }
  }
  const clock = state === "post" ? "FINAL" : E((st.type || {}).shortDetail || "");
  const pill = label ? `<span class="lp ${win == null ? "even" : win ? "win" : "lose"}">${label}</span>` : "";
  return { cls: win == null ? "" : win ? "lw" : "ll", html: `<div class="live">${pill}${score}<span class="clk">${clock}</span><span class="why">${extra.replace(/^ · /, "")}</span></div>` };
}
// LIVE RUNNING TOTAL (Scott 11/10: "right above the latest picks should be live graph going across screen like when bet
// made blip win it climbs lose it drops and keeps ticking across screen with minutes as go by"). Tonight's Kalshi paper
// dollars: a blip when a bet is made (green / red while its game is live), a step up or down when its result lands, the
// line running on to "now" (pulsing) as the minutes pass. Kalshi fills only - the headline record.
const ctMs = t => { const m = String(t || "").match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)(?::(\d\d))?/);
  return m ? Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)) : null; };          // naive CT -> one clock
const nowCt = () => ctMs(new Date().toLocaleString("sv-SE", { timeZone: "America/Chicago" }).replace(" ", "T"));
function drawChart(k) { try { drawChart0(k); } catch (e) { const el = $("chart"); if (el) el.innerHTML = ""; } }   // never blanks the page
function drawChart0(k) {
  const el = $("chart"); if (!el) return;
  const todayCt = new Date().toLocaleDateString("en-CA", { timeZone: "America/Chicago" });
  const day = k.day || todayCt, live = day === todayCt || !!nowCt() && nowCt() - ctMs(day + "T00:00") < 30 * 3600e3;
  // the session day (r.d), so a late game settling after midnight stays on tonight's line
  const rows = (k.rows || []).filter(r => (r.d || String(r.t || "").slice(0, 10)) === day);
  const bets = rows.filter(r => r.st === "FILLED" || r.st === "PARTIAL");
  if (!bets.length) { el.innerHTML = ""; return; }
  const evs = [];
  bets.forEach(r => {
    const tb = ctMs(r.t); if (tb != null) evs.push({ t: tb, kind: "bet", r });
    const tg = ctMs(r.gat); if (tg != null && (r.res === "WIN" || r.res === "LOSS" || r.res === "VOID")) evs.push({ t: tg, kind: "res", r, d: N(r.pl) || 0 });
  });
  let now = nowCt();
  if (now == null || !evs.length) { el.innerHTML = ""; return; }
  evs.sort((a, b) => a.t - b.t || (a.kind === b.kind ? 0 : a.kind === "bet" ? -1 : 1));
  let cum = 0;
  evs.forEach(e => { if (e.kind === "res") cum = Math.round((cum + e.d) * 100) / 100; e.v = cum; });
  const lastT = evs[evs.length - 1].t;
  now = live ? Math.max(now, lastT) : lastT + 10 * 60e3;          // a past night ends at its last result
  const t0 = Math.min(evs[0].t, now - 3600e3) - 5 * 60e3, t1 = Math.max(now, lastT) + 4 * 60e3;
  const vals = [0, ...evs.map(e => e.v)], lo = Math.min(...vals), hi = Math.max(...vals), pad = Math.max(5, (hi - lo) * 0.15);
  const W = Math.max(280, (el.clientWidth || 624) - 24), H = 200, L = 46, R = 12, T = 10, B = 22;
  const X = t => L + (W - L - R) * (t - t0) / (t1 - t0), Y = v => T + (H - T - B) * (1 - (v - (lo - pad)) / ((hi + pad) - (lo - pad)));
  let d = `M${X(t0).toFixed(1)},${Y(0).toFixed(1)}`;
  evs.forEach(e => { if (e.kind === "res") d += ` H${X(e.t).toFixed(1)} V${Y(e.v).toFixed(1)}`; });
  d += ` H${X(now).toFixed(1)}`;
  const dir = cum > 0 ? "up" : cum < 0 ? "dn" : "ev";
  const area = `${d} V${Y(0).toFixed(1)} H${X(t0).toFixed(1)} Z`;
  const step = Math.max(1, Math.ceil(30 / ((W - L - R) * 3600e3 / (t1 - t0))));      // hour labels never crowd on a phone
  const hours = []; for (let h = Math.ceil(t0 / (step * 3600e3)) * step * 3600e3; h <= t1; h += step * 3600e3) hours.push(h);
  const hl = h => { const x = new Date(h).getUTCHours(); return `${x % 12 || 12}${x < 12 ? "a" : "p"}`; };
  const yt = [Math.round(lo - pad / 2), 0, Math.round(hi + pad / 2)].filter((v, i, a) => a.indexOf(v) === i);
  const valAt = t => { let v = 0; evs.forEach(e => { if (e.kind === "res" && e.t <= t) v = e.v; }); return v; };
  const marks = evs.map(e => {
    const g = `${e.r.side || ""} ${num(e.r.line, 1)} ${e.r.game || ""}`;
    if (e.kind === "bet") {
      const open = !e.r.res, lv = open ? liveOf(e.r).cls : "";
      return `<circle class="bet ${lv}" cx="${X(e.t).toFixed(1)}" cy="${Y(valAt(e.t)).toFixed(1)}" r="4.5"><title>${E(when(e.r.t)[1])} bet: ${E(g)} at ${odds(e.r.ko)}</title></circle>`;
    }
    const c = e.r.res === "WIN" ? "w" : e.r.res === "LOSS" ? "l" : "bet";            // colour by the result, not the sign
    return `<circle class="${c}" cx="${X(e.t).toFixed(1)}" cy="${Y(e.v).toFixed(1)}" r="5"><title>${E(when(e.r.gat)[1])} ${E(e.r.res)} ${sgn(e.d)}: ${E(g)}</title></circle>`;
  }).join("");
  // the headline = the day's own total (the BY DAY row), so it always matches - even past ROWS_MAX picks
  const dr = (k.days || []).find(x => x.day === day);
  const tot = dr ? N(dr.profit) || 0 : cum, nW = dr ? N(dr.w) || 0 : evs.filter(e => e.r.res === "WIN" && e.kind === "res").length,
        nL = dr ? N(dr.l) || 0 : evs.filter(e => e.r.res === "LOSS" && e.kind === "res").length;
  const open = bets.filter(r => !r.res).length;
  const title = live ? "TONIGHT" : String(dayLbl(day)).toUpperCase();
  el.innerHTML = `<div class="chart"><div class="ch"><b class="${cls(tot)}">${title} ${sgn(tot)}</b>
    <span>Kalshi paper · ${num(nW)}-${num(nL)}${open ? ` · ${num(open)} open` : ""} · ● bet made · <span class="pos">●</span> win <span class="neg">●</span> loss</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Tonight's running total">
      <defs><linearGradient id="gUp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e" stop-opacity=".35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></linearGradient>
        <linearGradient id="gDn" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ef4444" stop-opacity=".35"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></linearGradient>
        <clipPath id="cUp"><rect x="0" y="0" width="${W}" height="${Y(0).toFixed(1)}"/></clipPath>
        <clipPath id="cDn"><rect x="0" y="${Y(0).toFixed(1)}" width="${W}" height="${H}"/></clipPath></defs>
      ${hours.map(h => `<line class="grid" x1="${X(h).toFixed(1)}" x2="${X(h).toFixed(1)}" y1="${T}" y2="${H - B}"/><text class="tick" x="${X(h).toFixed(1)}" y="${H - 6}" text-anchor="middle">${hl(h)}</text>`).join("")}
      ${yt.map(v => `<text class="tick" x="${L - 6}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${v === 0 ? "$0" : (v > 0 ? "+$" : "-$") + Math.abs(Math.round(v))}</text>`).join("")}
      <line class="zero" x1="${L}" x2="${W - R}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"/>
      ${evs.some(e => e.v !== 0) ? `<path class="area up" clip-path="url(#cUp)" d="${area}"/><path class="area dn" clip-path="url(#cDn)" d="${area}"/>
      <path class="ln up" clip-path="url(#cUp)" d="${d}"/><path class="ln dn" clip-path="url(#cDn)" d="${d}"/>` : `<path class="ln ev" d="${d}"/>`}
      ${marks}
      ${live ? `<circle class="ring" cx="${X(now).toFixed(1)}" cy="${Y(cum).toFixed(1)}" r="6"/>` : ""}<circle class="head" cx="${X(now).toFixed(1)}" cy="${Y(cum).toFixed(1)}" r="4"/>
    </svg></div>`;
}

function gradedCls(res) { return res === "WIN" ? "lw" : res === "LOSS" ? "ll" : null; }

function row(r) {
  const [d, t] = when(r.t);
  const book = r.bk ? E(r.bk) : "Auto Lives line";
  const conf = N(r.p) != null ? `win chance ${pct(r.p)}${r.cohort ? ` (${E(r.cohort)}, ${num(r.n)} graded)` : ""}` : "";
  const kx = venueLine("KALSHI", r.side, r.k, r.gap, r.ko, r.dep, r.st, r.why, r.res, r.pl, r.best === "KALSHI")
           + venueLine("POLY", r.side, r.pk, r.pgap, r.po, r.pdep, r.pst, r.pwhy, r.pres, r.ppl, r.best === "POLY");
  const bk = r.bres ? `logged line: ${E(r.bres)}${N(r.bpl) != null ? " " + sgn(r.bpl) : ""}` : "";
  const lv = liveOf(r), rc = gradedCls(r.best === "POLY" ? r.pres : r.res) || lv.cls;
  return `<div class="krow ${rc}"><div class="t"><b>${E(t)}</b><span>${E(d)} · ${E(r.lg)}${r.eng ? " · " + E(r.eng) : ""}</span></div>
    <div><div class="pk">${E(r.side)} ${num(r.line, 1)} <span class="why">at ${odds(r.bo)} (${book})</span></div><div class="gm">${E(r.game)}</div>${lv.html}${conf ? `<div class="why">${conf}</div>` : ""}${N(r.stake) ? `<div class="why">stake ${usd(r.stake)}${N(r.delay) != null ? ` · priced ${num(r.delay)}s after the pick` : ""}</div>` : ""}</div>
    <div class="kx">${kx}</div>
    <div class="r">${badge(r.best === "POLY" ? r.pst : r.st, r.best === "POLY" ? r.pres : r.res)}<span>${r.bwhy ? E(r.bwhy) : ""}</span><span>${bk}</span></div></div>`;
}
function tile(k, v, s) { return `<div class="ktile"><div class="k">${E(k)}</div><div class="v">${v}</div><div class="s">${s}</div></div>`; }
function recSub(r) { return r && N(r.graded) ? `<span class="${cls(r.profit)}">${sgn(r.profit)}</span> on ${usd(r.staked)} · ROI ${pct(r.roi)}` : `${num((r || {}).fills)} filled, none graded`; }
function draw(k, at) {
  const s = k.status || {}, age = N(s.runner_age_s), up = age != null && age < 120;
  const fedAge = Date.now() - Date.parse(at || "");
  $("status").innerHTML = `<div class="status"><span><span class="dot ${age == null ? "unk" : up ? "up" : "down"}"></span>Runner <b>${age == null ? "unknown" : up ? "up" : "down"}</b> when sent</span>
    <span>Sent <b>${ago(at)}</b>${fedAge > 10 * 60000 ? ' <span class="neg">(stale - the PC sends every 2 min while the runner is up)</span>' : ""}</span>
    <span>Health <b class="${s.health === "OK" ? "pos" : "neg"}">${E(s.health || "?")}</b></span><span>${E(s.detail || "")}</span></div>`;
  const a = (k.record || {}).all || {}, c = k.counts || {}, pr = k.price, v = k.venues || {};
  const tiles = [tile("KALSHI", recTxt(a), recSub(a))];
  const since = v.since ? ` · SINCE ${String(dayLbl(v.since)).toUpperCase()}` : "";
  const sameK = v.KALSHI && N(v.KALSHI.graded) ? `<div>Kalshi, same days: ${recTxt(v.KALSHI)} <span class="${cls(v.KALSHI.profit)}">${sgn(v.KALSHI.profit)}</span></div>` : "";
  if (v.POLY) tiles.push(tile("POLYMARKET" + since, recTxt(v.POLY), recSub(v.POLY) + sameK));
  if (v.BEST) tiles.push(tile("BEST PRICE (EACH PICK)" + since, recTxt(v.BEST), recSub(v.BEST) + sameK));
  tiles.push(tile("AT THE LOGGED LINE", N(a.book_w) + N(a.book_l) ? `${num(a.book_w)}-${num(a.book_l)}` : "—",
    N(a.book_w) + N(a.book_l) ? `<span class="${cls(a.book_profit)}">${sgn(a.book_profit)}</span> (comparison only)` : "waits for grades"));
  tiles.push(tile("PRICED / FILLED", `${num(c.priced)} / ${num(c.fills)}`, `${num(c.late)} seen late (runner not up yet)`));
  tiles.push(tile("AVERAGE KALSHI PRICE", pr ? odds(pr.kalshi) : "—", pr ? `vs ${odds(pr.book)} logged, ${num(pr.n)} fills` : "no fills yet"));
  $("tiles").innerHTML = `<div class="ktiles">${tiles.join("")}</div>`;
  drawChart(k);
  const rows = k.rows || [];
  $("rows").innerHTML = `<div class="sech">LATEST PICKS<small>${rows.length ? `newest ${rows.length}` : ""}</small></div>` +
    (rows.length ? `<div class="lsec">${rows.map(row).join("")}</div>` : `<div class="empty">No picks priced yet. Auto Lives makes them once NBA / college games are under way; they show here within a few minutes.</div>`);
  const bd = k.boards;
  if (bd) {
    const rc = bd.records || {};
    const brow = r => {
      const kx = venueLine("KALSHI", "", r.k, null, r.ko, null, r.kst, r.kwhy, r.kres, r.kpl, r.best === "KALSHI")
               + venueLine("POLY", "", r.pk, null, r.po, null, r.pst, r.pwhy, r.pres, r.ppl, r.best === "POLY");
      const [d, t] = when(r.t);
      const lv = liveOf(r), rc = gradedCls(r.best === "POLY" ? r.pres : r.kres) || lv.cls;
      return `<div class="krow ${rc}"><div class="t"><b>${E(t)}</b><span>${E(d)} · ${E(r.lg)}</span></div>
        <div><div class="pk">${E(r.bet)} <span class="why">at ${odds(r.bo)}${r.bk ? " " + E(r.bk) : ""}</span></div><div class="gm">${E(r.game)}</div>${lv.html}
        <div class="why">posted on ${E((r.boards || []).join(", "))}${N(r.stake) ? ` · stake ${usd(r.stake)}` : ""}</div></div>
        <div class="kx">${kx}</div><div class="r"><span>${r.bwhy ? E(r.bwhy) : ""}</span></div></div>`;
    };
    $("boards").innerHTML = `<div class="sech">ALL BOARD PICKS<small>every posted game line (ML + totals) priced pregame on both venues · ${num(bd.n)} so far · spreads, props, tennis next</small></div>
      <div class="ktiles">${["KALSHI", "POLY", "BEST"].map(v => tile(v === "BEST" ? "BEST PRICE" : VNAME[v], recTxt(rc[v]), recSub(rc[v]))).join("")}</div>` +
      ((bd.rows || []).length ? `<div class="lsec">${bd.rows.map(brow).join("")}</div>` : `<div class="empty">No board picks priced yet. Each one is priced on both venues as its board posts it, before the game starts.</div>`);
  } else $("boards").innerHTML = "";
  const b = k.both;
  if (b) {
    const sa = (b.summary || {}).ARB || {}, sm = (b.summary || {}).MIDDLE || {}, ru = b.rules || {};
    const legs = p => (p.legs || []).map(l => `${E(VNAME[l.v] || l.v)} ${E(l.s)} ${num(l.k, 1)} @ ${num(N(l.px) * 100, 1)}¢`).join(" + ");
    const res = p => p.status === "GRADED" ? `<span class="rb ${p.result === "ONE LEG" ? "ONE" : E(p.result)}">${E(p.result)}</span> <span class="${cls(p.profit)}">${sgn(p.profit)}</span>` : '<span class="rb OPEN">OPEN</span>';
    $("both").innerHTML = `<div class="sech">BOTH SIDES<small>Kalshi vs Polymarket, every live game, every minute · ${num(b.scans_today)} scans today${b.last_scan_at ? `, last ${E(String(b.last_scan_at).slice(11, 16))} (${num(b.last_live_games)} live games)` : ""}</small></div>
      <div class="ktiles">${tile("ARBS (PROFIT EITHER WAY)", num(sa.found), N(sa.graded) ? `${num(sa.graded)} graded · <span class="${cls(sa.profit)}">${sgn(sa.profit)}</span> on ${usd(sa.outlay)}` : `a pair under $${num(ru.arb_max, 2)} per $1, fees in`)}
      ${tile("MIDDLES (WIN BOTH IN THE WINDOW)", num(sm.found), N(sm.graded) ? `hit ${num(sm.hits)} of ${num(sm.graded)} · <span class="${cls(sm.profit)}">${sgn(sm.profit)}</span> on ${usd(sm.outlay)}` : `a pair up to $${num(ru.middle_max, 2)} per $1`)}</div>` +
      ((b.plays || []).length ? `<div class="lsec xs"><table class="kt"><tr><th>TIME</th><th>GAME</th><th>PLAY</th><th style="text-align:right">PER $1</th><th style="text-align:right">PAIRS</th><th style="text-align:right">RESULT</th></tr>
      ${b.plays.map(p => `<tr><td style="white-space:nowrap">${E(String(p.at || "").slice(11, 16))}<div class="why">${E(p.league)} ${E(p.period || "")} ${E(p.clock || "")}</div></td><td>${E(p.game)}</td><td><b>${E(p.kind)}</b>${p.window ? ` ${num(p.window[0], 1)}-${num(p.window[1], 1)}` : ""}<div class="why">${legs(p)}</div></td><td class="n">$${num(p.cost, 3)}</td><td class="n">${num(p.pairs)}</td><td class="n">${res(p)}</td></tr>`).join("")}</table></div>`
      : `<div class="empty">No arbs or middles yet. The two venues usually agree within a cent near the live total — this lists every time they don't.</div>`);
  } else $("both").innerHTML = "";
  const sz = k.sizing || {}, caps = sz.caps || {}, start = N(sz.start) || 1500;
  $("sizing").innerHTML = (sz.plans || []).length ? `<div class="sech">SIZING PLANS<small>$${num(start)} start · caps ${pct(caps.bet)}/bet, ${pct(caps.game)}/game, ${pct(caps.night)}/night · Kalshi fills · paper</small></div>
    <div class="lsec"><table class="kt"><tr><th>PLAN</th><th style="text-align:right">BANKROLL</th><th style="text-align:right">BETS</th><th style="text-align:right">WORST DROP</th></tr>
    ${sz.plans.map(p => `<tr><td><b>${E(p.label)}</b>${N(p.over_depth) ? `<div class="why">${num(p.over_depth)} stakes above Kalshi's depth</div>` : ""}</td><td class="n ${cls(N(p.final) - start)}">${usd(p.final)}</td><td class="n">${num(p.bets)}</td><td class="n">${pct(p.max_dd)}</td></tr>`).join("")}</table></div>` : "";
  const gaps = k.gaps || [], nf = Object.entries(k.no_fill || {});
  $("gaps").innerHTML = gaps.length || nf.length ? `<div class="sech">KALSHI LINE vs OURS</div><div class="lsec"><table class="kt"><tr><th>KALSHI LINE</th><th style="text-align:right">FILLED</th><th style="text-align:right">RECORD</th><th style="text-align:right">PROFIT</th></tr>
    ${gaps.map(g => `<tr><td>${E(g.label)}</td><td class="n">${num(g.rec.fills)}</td><td class="n">${recTxt(g.rec)}</td><td class="n ${cls(g.rec.profit)}">${N(g.rec.graded) ? sgn(g.rec.profit) : "—"}</td></tr>`).join("")}
    ${nf.map(([why, n]) => `<tr><td colspan="3"><span class="why">No fill: ${E(why)}</span></td><td class="n">${num(n)}</td></tr>`).join("")}</table></div>` : "";
  const days = k.days || [];
  $("days").innerHTML = days.length ? `<div class="sech">BY DAY<small>Kalshi fills</small></div><div class="lsec"><table class="kt"><tr><th>DAY</th><th style="text-align:right">PRICED</th><th style="text-align:right">FILLED</th><th style="text-align:right">KALSHI</th><th style="text-align:right">PROFIT</th><th style="text-align:right">LOGGED LINE</th></tr>
    ${days.map(d => `<tr><td>${dayLbl(d.day)}${N(d.late) ? ` <span class="why">+${num(d.late)} late</span>` : ""}</td><td class="n">${num(d.picks)}</td><td class="n">${num(d.fills)}</td><td class="n">${N(d.w) + N(d.l) ? `${num(d.w)}-${num(d.l)}` : "—"}</td><td class="n ${cls(d.profit)}">${N(d.w) + N(d.l) ? sgn(d.profit) : "—"}</td><td class="n">${N(d.book_w) + N(d.book_l) ? `${num(d.book_w)}-${num(d.book_l)}` : "—"}</td></tr>`).join("")}</table></div>` : "";
  $("note").innerHTML = `<p class="note2">PAPER — no account, no money, no orders. Each pick is priced on Kalshi and Polymarket US within seconds of
    Auto Lives making it: on each venue the line at least as good as ours, an order of the pick's own stake (units × $5) walked through
    the live book, the venue's fee included, graded off that venue's own result. BEST = the venue the pick takes, chosen when it was
    priced, never after. "Logged line" is the same pick at the line + price Auto Lives wrote down — a comparison, not a CMMG record.
    Both sides = an Over on one venue + an Under on the other: an arb costs under $1 per $1 pair (profit either way); a middle costs a
    little over $1 and wins both legs if the final lands in its window. Sizing plans start at $1,500 and are paper; which one ever sizes
    real money is Scott's call.</p>`;
}
async function load() {
  const sess = CMMG.session();
  if (!sess) { STOP = true; gate("Owner only. Sign in with Discord to see the paper run.", true); return; }
  let j; try { j = await CMMG.relay({ task: "kalshi", session: sess.token }); } catch (e) { j = null; }
  if (!j) { gate("Couldn't reach CMMG right now — trying again shortly."); return; }
  if (!j.ok && j.error === "unknown task") { gate("<b>Almost there.</b> This page needs the CMMG relay v1.20 deployed in Apps Script."); return; }
  if (!j.ok) { gate(E(j.error || "Sign in again to continue."), /sign in/i.test(j.error || "")); return; }
  try { sessionStorage.setItem("cmmg.kalshi.owner", j.denied ? "0" : "1"); } catch (e) {}   // the menu's owner-only chip
  if (j.denied) { STOP = true; gate("<b>Owner only for now.</b> This page is not open to members yet."); return; }
  if (!j.kalshi) { gate("<b>No data yet.</b> The PC sends this page every 2 minutes once the feed switch is on."); return; }
  $("gate").innerHTML = "";
  LAST = { k: j.kalshi, at: j.at };
  draw(j.kalshi, j.at);
  await scores(j.kalshi);
  draw(j.kalshi, j.at);
}
// the runner sends this page every 2 min (Scott 11/10 "it should react more frequently"); scores + colors every 30 s
let STOP = false;
setInterval(() => { if (!STOP && !document.hidden) load(); }, 120000);
setInterval(async () => { if (LAST && !document.hidden) { await scores(LAST.k); draw(LAST.k, LAST.at); } }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !STOP) load(); });
addEventListener("resize", () => { if (LAST) drawChart(LAST.k); });
SHELL.mount("kalshi");
load();
</script>
</body></html>
