<!doctype html>
<!-- SAVE AS: index.html · LOCATION: C:/MarvelApps/cmmgsite/app/dashboard/index.html
     Dashboard (storyboard page 1 / web designs #1-#2): today at a glance (tier counts, next game countdown), today's top
     picks (ICE > EDGE > FIRE, locked ones stay locked), the member's own tracker summary, quick links, membership.
     Real data only - NO CMMG win-rate / units headline until the record passes the edge-auditor check (WEB_DESIGNS
     flag #2: hindsight-selected All Bets numbers never go public). -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · CMMG Sports Edge</title><link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/app/manifest.webmanifest"><meta name="theme-color" content="#060d1a">
<link rel="icon" type="image/png" href="/img/lion_64.png"><link rel="apple-touch-icon" href="/img/apple_touch_180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CMMG">
<style>
.hero { position:relative; overflow:hidden; border-radius:16px; border:1px solid var(--line); padding:22px; margin-bottom:14px;
  background:linear-gradient(90deg, rgba(6,13,26,.96) 35%, rgba(6,13,26,.55)), url(/img/crest.jpg) right center / auto 150% no-repeat, var(--panel); }
.hero h1 { font-size:26px; } .hero .tag2 { letter-spacing:.28em; font-size:11px; color:var(--ice); margin-top:6px; }
.hero .hi { color:var(--dim); margin-top:10px; font-size:14px; }
.count { font-variant-numeric:tabular-nums; font-size:24px; font-weight:900; }
.mini { display:grid; gap:8px; }
.mini .card { grid-template-columns:90px 1fr 110px; padding:10px 12px; }
.links { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
@media (max-width:640px) { .links { grid-template-columns:repeat(2,1fr); } .mini .card { grid-template-columns:1fr auto; gap:6px 10px; } .mini .card .when { grid-column:1 / -1; display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .mini .card .when .tv { margin-top:0; } .hero { background:linear-gradient(180deg, rgba(6,13,26,.9), rgba(6,13,26,.97)), url(/img/crest.jpg) center top / cover no-repeat; } }
.link { text-decoration:none; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px; text-align:center; font-weight:800; }
.link span { display:block; margin-bottom:6px; } .link span .ic { width:30px; height:30px; color:#7fd8ff; filter:drop-shadow(0 0 6px rgba(127,216,255,.6)); }
</style></head>
<body>
<div class="layout">
  <main class="main">
    <div class="hero"><h1>Same picks. Same data. Anywhere.</h1><div class="tag2">ANALYZE. EXECUTE. PROFIT.</div><div class="hi" id="hi"></div></div>
    <div class="kpis" id="glance"><div class="kpi"><div class="l">LOADING</div><div class="n">…</div></div></div>
    <div class="box"><h3>TODAY'S TOP PICKS <a href="/app/" style="float:right;font-size:12px;color:var(--ice)">All picks →</a></h3><div class="mini" id="top"></div></div>
    <div class="links">
      <a class="link" href="/app/"><span data-ic="target"></span>Today's Picks</a><a class="link" href="/app/tracker/"><span data-ic="chart"></span>My Tracker</a>
      <a class="link" href="/app/tools/"><span data-ic="calc"></span>Tools</a><a class="link" href="/app/community/"><span data-ic="chat"></span>Community</a>
    </div>
  </main>
  <aside class="side">
    <div id="account"></div>
    <div><h3>MY TRACKER <a href="/app/tracker/" style="float:right;font-size:12px;color:var(--ice)">Open →</a></h3><div id="trk" style="color:var(--dim);font-size:13px">Sign in to track the picks you take.</div></div>
  </aside>
</div>
<script src="/js/cmmg.js"></script><script src="/js/icons.js"></script><script src="/js/shell.js"></script>
<script>
const E = CMMG.esc, TIER_ORDER = { ICE: 0, EDGE: 1, FIRE: 2 }, TIER_ICON = { ICE: ICON.tier("ICE"), EDGE: ICON.tier("EDGE"), FIRE: ICON.tier("FIRE") };
const SPORT_ICON = new Proxy({}, { get: (o, k) => ICON.sport(k) });
const ct = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString("en-US", { timeZone: "America/Chicago", hour: "numeric", minute: "2-digit" }) + " CT"; };
const odds = o => o == null || o === "" ? "" : (Number(o) > 0 ? "+" + o : String(o));
const sgn = n => (n > 0 ? "+" : "") + (Math.round(n * 100) / 100).toFixed(2);
let NEXT = null;

function hello() {
  const s = CMMG.session(), h = Number(new Date().toLocaleString("en-US", { timeZone: "America/Chicago", hour: "numeric", hour12: false }));
  const part = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  document.getElementById("hi").innerHTML = s ? `${part}, <b>${E(s.me.name)}</b> · ${SHELL.plan(s).name}` : `${part}. Sign in with Discord to see the picks your membership includes.`;
}

async function load() {
  const s = CMMG.session();
  let j; try { j = await CMMG.relay({ task: "picks", session: s ? s.token : undefined }); } catch (e) { j = { ok: false }; }
  const g = document.getElementById("glance"), top = document.getElementById("top");
  if (!j.ok) { g.innerHTML = `<div class="kpi"><div class="l">TODAY</div><div class="n" style="font-size:15px">Couldn't reach CMMG</div></div>`; return; }
  const nowCT = new Date(new Date().toLocaleString("en-US", { timeZone: "America/Chicago" }));
  const todayCT = nowCT.toLocaleDateString("en-CA"), yday = new Date(nowCT - 864e5).toLocaleDateString("en-CA");
  const stale = j.date && j.date < todayCT && !(j.date === yday && nowCT.getHours() < 10);       // same rule as Today's Picks
  const picks = stale ? [] : (j.picks || []).slice().sort((a, b) => (TIER_ORDER[a.tier] ?? 9) - (TIER_ORDER[b.tier] ?? 9) || String(a.time).localeCompare(String(b.time)));
  const n = t => picks.filter(p => p.tier === t).length;
  const upcoming = picks.map(p => Date.parse(p.time)).filter(t => t > Date.now()).sort((a, b) => a - b);
  NEXT = upcoming[0] || null;
  g.innerHTML = `<div class="kpi"><div class="l">TODAY'S PICKS</div><div class="n">${picks.length}</div></div>
    <div class="kpi"><div class="l">${ICON.tier("ICE")} ICE · ${ICON.tier("EDGE")} EDGE · ${ICON.tier("FIRE")} FIRE</div><div class="n" style="font-size:20px">${n("ICE")} · ${n("EDGE")} · ${n("FIRE")}</div></div>
    <div class="kpi"><div class="l">NEXT GAME</div><div class="count" id="cd">${NEXT ? "" : "—"}</div></div>
    <div class="kpi"><div class="l">YOUR ACCESS</div><div class="n" style="font-size:16px">${picks.filter(p => !p.locked).length} of ${picks.length} open</div></div>`;
  tick();
  if (!picks.length) { top.innerHTML = `<div class="empty" style="border:0">${stale ? "Today's picks aren't posted yet." : "No picks posted yet today."}</div>`; return; }
  top.innerHTML = picks.slice(0, 3).map(p => p.locked
    ? `<div class="card locked"><div class="when"><b>${ct(p.time)}</b><span>${SPORT_ICON[p.sport] || "🎯"} ${E(p.sport)}</span></div>
        <div><span class="tag ${E(p.tier)}">${TIER_ICON[p.tier] || ""} ${E(p.tier)}</span><div class="lockmsg" style="margin-top:6px">${ICON.ui("lock")} Members only</div></div>
        <div class="right"><a class="btn" style="background:var(--gold);color:#241a00;text-decoration:none;display:inline-block" href="${SHELL.UPGRADE}">Unlock</a></div></div>`
    : `<div class="card"><div class="when"><b>${ct(p.time)}</b><span>${SPORT_ICON[p.sport] || "🎯"} ${E(p.sport)}</span>${p.tv ? `<div class="tv">${ICON.ui("tv")} ${E(p.tv)}</div>` : ""}</div>
        <div><span class="tag ${E(p.tier)}">${TIER_ICON[p.tier] || ""} ${E(p.tier)}</span> ${p.need === "free" ? '<span class="pill">FREE PICK</span>' : ""}
          <div class="pick" style="margin-top:4px;font-size:16px">${E(p.bet)}</div><div class="game">${E(p.game)}</div></div>
        <div class="right"><div class="odds">${odds(p.odds)}</div><div class="book">${E(p.book || "")}</div></div></div>`).join("");
}

function tick() {
  const el = document.getElementById("cd"); if (!el || !NEXT) return;
  const ms = NEXT - Date.now();
  if (ms <= 0) { el.textContent = "Starting"; return; }
  const h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4), sec = Math.floor(ms % 6e4 / 1e3);
  el.textContent = h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m ${String(sec).padStart(2, "0")}s`;
}

async function tracker() {
  const s = CMMG.session(), el = document.getElementById("trk"); if (!s) return;
  let j; try { j = await CMMG.relay({ task: "mytracker", session: s.token }); } catch (e) { return; }
  if (!j.ok) return;
  const m = j.summary, wl = m.won + m.lost;
  el.innerHTML = `<div class="stats"><div><b>${m.won}-${m.lost}${m.pushes ? "-" + m.pushes : ""}</b><span>Record</span></div>
    <div><b class="${m.net_units > 0 ? "pos" : m.net_units < 0 ? "neg" : ""}">${sgn(m.net_units)}</b><span>Net units</span></div>
    <div><b>${m.pending}</b><span>Pending</span></div></div>
    <p style="margin:8px 0 0">${wl ? `${(100 * m.won / wl).toFixed(1)}% win rate on ${wl} graded picks, at your odds.` : "Tap “✓ I Took This Pick” on a pick to start."}</p>`;
}

SHELL.mount("dashboard"); document.querySelectorAll("[data-ic]").forEach(e => e.innerHTML = ICON.ui(e.dataset.ic)); hello(); load(); tracker();
setInterval(tick, 1000); setInterval(load, 5 * 60000);
</script>
</body></html>
