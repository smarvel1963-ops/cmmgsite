<!doctype html>
<!-- SAVE AS: index.html · LOCATION: C:/MarvelApps/cmmgsite/app/tracker/index.html
     My Tracker - PERFORMANCE LAB (Scott's design list #3, 10/11): tabs Overview / By Sport / By Tier / By Bet Type /
     History, ranges 7D / 30D / 90D / YTD / All. Overview = YOUR results beside CMMG results (CMMG side comes from the relay
     "results" task and shows "goes live soon" until RESULTS_PUBLIC=1), cumulative-units chart (yours + CMMG when
     published), win rate + units by tier (ICE > EDGE > FIRE). Bet type is read from the pick text (ML / spread / total /
     prop). History keeps Edit / Remove. Member's own data only, graded at THEIR odds.
     Records fix (Scott 10/12 "yes"): the CMMG side is PRO TRACK only, at each pick's STORED profit (real graded payout,
     never odds x units); the Free Pick shows as its own line, never added in. When the range reaches back before the
     feed's earliest graded date the CMMG card says the date its numbers start. YOUR side is unchanged (your odds).
     CMMG RECORD tab (Scott 10/18 "my tracker should be over all record like from sessions ... just like masterhub each
     individual sport can track own records ... keep consistent"; "we should not be rebuilding units"): MasterHub's OWN
     per-sport and per-page records (relay task "hubrecords", feed part "hub" from page_stats_tracker) - Today / Week /
     Month / All exactly as each MasterHub page shows them. Copied, never recomputed here. The tab appears only when the
     relay serves it (owner by default).
     MEMBERS tab + SHARE box (Scott 10/18 "how would me track each individules bets they mark" -> "both"; relay v1.16):
     the owner sees ANONYMOUS totals of what members mark + the named tracker of members who tick "Share my tracker
     with CMMG". Both appear only when the relay has MEMBERS_ON. Privacy page updated the same day. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Tracker · CMMG Sports Edge</title><link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/app/manifest.webmanifest"><meta name="theme-color" content="#060d1a">
<link rel="icon" type="image/png" href="/img/lion_64.png"><link rel="apple-touch-icon" href="/img/apple_touch_180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CMMG">
<style>
.vhero { position:relative; overflow:hidden; border-radius:18px; border:1px solid var(--line); padding:22px; margin-bottom:12px;
  background:linear-gradient(90deg, rgba(5,11,22,.95) 45%, rgba(5,11,22,.35)), url(/img/splash.jpg) right 30% / 50% auto no-repeat, #070f1d; }
.vhero h1 { font-size:clamp(28px, 4.6vw, 48px); font-style:italic; margin:0; line-height:1; }
.vhero h2 { margin:2px 0 0; font-family:Saira; font-style:italic; font-size:clamp(16px, 2.4vw, 24px); letter-spacing:.12em; color:#3ba9ff; }
.vhero p { margin:8px 0 0; letter-spacing:.16em; font-weight:700; font-size:11px; color:#ffd700; }
.tabs2 { display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; scrollbar-width:none; } .tabs2::-webkit-scrollbar { display:none; }
.tabs2 button, .rng button { flex:0 0 auto; background:rgba(10,22,40,.6); border:1px solid var(--line); color:var(--dim); border-radius:10px; padding:8px 14px; font-weight:800; font-size:13px; }
.tabs2 button.on, .rng button.on { background:linear-gradient(180deg,#2563eb,#1d4ed8); color:#fff; border-color:#3b82f6; box-shadow:0 0 14px rgba(59,130,246,.45); }
.rng { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media (max-width:640px) { .two { gap:8px; } } .two > * { min-width:0; }
.rc h3 { display:flex; align-items:center; gap:8px; } .rc h3 .ic { width:22px; height:22px; } .rc.you h3 .ic { color:#4ade80; } .rc.cm h3 .ic { color:#ffd700; }
.rc .row b { font-family:Saira; font-size:17px; }
.bars { display:flex; align-items:flex-end; justify-content:space-around; gap:10px; height:180px; padding-top:10px; }
.bars > div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; min-width:0; }
.bars .v { font-family:Saira; font-weight:800; font-size:15px; } .bars i { display:block; width:70%; border-radius:6px 6px 2px 2px; min-height:3px; }
.bars .lb { font-size:11px; font-weight:800; display:flex; flex-direction:column; align-items:center; gap:2px; } .bars .lb small { color:var(--dim); font-weight:600; }
.bars .ic { width:20px; height:20px; }
.legend { display:flex; gap:14px; font-size:12px; color:var(--dim); margin-bottom:6px; } .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
.hf { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; } .hf select { padding:8px; border-radius:9px; border:1px solid var(--line); background:#081325; color:var(--text); font:inherit; }
.lock2 { text-align:center; color:var(--dim); font-size:13px; padding:18px 6px; } .lock2 b { color:#ffd700; display:block; margin-bottom:4px; }
.autoall { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; margin-bottom:12px; border-radius:12px; border:1px solid rgba(74,222,128,.4); background:rgba(22,163,74,.08); font-size:13px; color:var(--dim); cursor:pointer; }
.autoall b { color:var(--text); } .autoall input { margin-top:2px; width:18px; height:18px; flex:none; }
.hubt td, .hubt th { white-space:nowrap; }
@media (max-width:640px) { .hubt td, .hubt th { padding:8px 5px; font-size:12px; } .hubt td:first-child { max-width:120px; overflow:hidden; text-overflow:ellipsis; } }
</style></head>
<body>
<div class="layout wide">
  <main class="main">
    <div class="vhero"><h1>MY TRACKER</h1><h2>PERFORMANCE LAB</h2><p>YOUR PICKS. OUR PICKS. REAL RESULTS.</p></div>
    <label class="autoall" id="autoBox" hidden><input type="checkbox" id="autoAll"> <span><b>I play every CMMG pick</b> — count every Pro Track + Free pick in my record automatically, at CMMG's odds and stake. Picks I edit keep my own numbers.</span></label>
    <label class="autoall" id="shareBox" hidden style="border-color:rgba(255,215,0,.35);background:rgba(255,215,0,.06)"><input type="checkbox" id="shareMine"> <span><b>Share my tracker with CMMG</b> - the CMMG team sees my Discord name and the picks I mark. Off = only I see my tracker by name (<a href="/privacy/" style="color:var(--ice)">privacy</a>).</span></label>
    <div class="tabs2" id="tabs"></div>
    <div class="rng" id="rng"></div>
    <div id="body"><div class="empty">Loading…</div></div>
  </main>
</div>
<dialog id="ed"><form method="dialog" id="edForm">
  <h3 style="margin-top:0">Edit my pick</h3><p id="edWhat" style="color:var(--dim);margin:0 0 6px"></p>
  <label>My odds<input name="odds" inputmode="numeric" required></label>
  <label>Units<input name="units" inputmode="decimal" required></label>
  <label>Sportsbook (optional)<input name="book" maxlength="30"></label>
  <label>Note (optional)<input name="note" maxlength="200"></label>
  <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn go" value="save">Save</button><button class="btn ghost" value="remove" formnovalidate style="color:#fca5a5">Remove</button><button class="btn ghost" value="cancel" formnovalidate>Cancel</button></div>
</form></dialog>
<div class="toast" id="toast"></div>
<script src="/js/cmmg.js"></script><script src="/js/icons.js"></script><script src="/js/icons-color.js"></script><script src="/js/shell.js"></script>
<script>
const E = CMMG.esc, $ = id => document.getElementById(id), TIERS = ["ICE", "EDGE", "FIRE"];
const TCOL = { ICE: "#3b82f6", EDGE: "#22c55e", FIRE: "#ef4444" };
let MEM = null, MVIEW = "over", MOPEN = "";
let HUB = null, HUB_AT = "", HPER = "all", HVIEW = "sports", TAB_PICKED = false;
let ROWS = [], AUTO_SINCE = "", CM = null, TAB = "over", RNG = "30", EDIT = null, HF = { sport: "", tier: "", type: "" };
try { RNG = localStorage.getItem("cmmg.trkrng") || "30"; } catch (e) {}
const ctDay = d => d.toLocaleDateString("en-CA", { timeZone: "America/Chicago" });
const odds = o => o == null || o === "" ? "—" : (Number(o) > 0 ? "+" + o : String(o));
const sgn = n => n == null ? "—" : (n > 0 ? "+" : "") + (Math.round(n * 100) / 100).toFixed(2);
const pct = n => n == null ? "—" : (n > 0 ? "+" : "") + (100 * n).toFixed(1) + "%";
const nice = d => { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(d || ""); return m ? new Date(Date.UTC(+m[1], m[2] - 1, +m[3], 12)).toLocaleDateString("en-US", { timeZone: "UTC", month: "short", day: "numeric" }) : ""; };
const toast = t => { const el = $("toast"); el.textContent = t; el.style.display = "block"; setTimeout(() => el.style.display = "none", 2600); };
const rowDay = r => r.date || (r.at ? ctDay(new Date(r.at)) : "");
const dec = o => { o = Number(o); return o > 0 ? 1 + o / 100 : o < 0 ? 1 + 100 / -o : 0; };
const PROP = /\b(pts|points|reb|rebounds|ast|assists|sog|shots|hits|outs|yds|yards|strikeouts|ks|tb|hr|rbi|saves|goals|threes)\b/i;
const betType = b => { const s = String(b || "").trim();
  if (/\bML\b|moneyline/i.test(s)) return "Moneyline";
  if (PROP.test(s)) return "Player Prop";
  if (/^(over|under)\b/i.test(s) || /^[ou]\s?\d/i.test(s)) return "Total";
  if (/[+-]\d+(\.\d)?\s*$/.test(s)) return "Spread";
  return "Other"; };
// "today" follows the betting SESSION (Scott 10/12: "shouldn't my tracker coincide with sessions"): picks are dated by
// the session day the PC feed publishes, so after an evening CLOSE DAY tomorrow's picks carry tomorrow's date. The range
// ends at the LATER of the calendar day and the session day, so they count at once; before the close nothing moves.
let SESSION_DAY = "";
const todayKey = () => { const c = ctDay(new Date()); return SESSION_DAY > c ? SESSION_DAY : c; };
function inRange(d) {
  if (RNG === "all") return true; if (!d) return false;
  const today = todayKey(), end = new Date(today + "T12:00:00Z");
  if (RNG === "ytd") return d >= today.slice(0, 4) + "-01-01" && d <= today;
  return d >= new Date(end - (Number(RNG) - 1) * 864e5).toISOString().slice(0, 10) && d <= today;
}
function stats(rows, plKey, oddsKey, stored) {
  const g = rows.filter(r => r.result === "WIN" || r.result === "LOSS"), w = g.filter(r => r.result === "WIN").length;
  const push = rows.filter(r => r.result === "PUSH").length;
  // stored = CMMG side: the pick's STORED profit (CMMG.pl), never re-priced; a missing payout makes the total unknown
  const pl = stored ? r => CMMG.pl(r) : r => plKey && r[plKey] != null ? Number(r[plKey]) : (r.result === "WIN" ? (Number(r.units) || 1) * ((dec(r[oddsKey]) || 1) - 1) : r.result === "LOSS" ? -(Number(r.units) || 1) : 0);
  const done = rows.filter(r => ["WIN", "LOSS", "PUSH"].includes(r.result));
  const net = stored ? CMMG.net(done) : done.reduce((a, r) => a + pl(r), 0), risk = done.reduce((a, r) => a + (Number(r.units) || 1), 0);
  return { w, l: g.length - w, push, n: g.length, wr: g.length ? w / g.length : 0, net, roi: net == null ? null : risk ? net / risk : 0, pl };
}
const mineS = rows => stats(rows, "units_pl", "myOdds"), cmmgS = rows => stats(rows, null, "odds", true);
// the start of the selected range ("" = all time) - the CMMG card names the date its data starts when the range
// reaches back further than the feed's history (Scott 10/12 #7: a label never claims more history than the data holds)
function rangeStart() {
  if (RNG === "all") return ""; const today = todayKey();
  return RNG === "ytd" ? today.slice(0, 4) + "-01-01" : new Date(new Date(today + "T12:00:00Z") - (Number(RNG) - 1) * 864e5).toISOString().slice(0, 10);
}

function chart(series) {
  const W = 640, H = 200, P = 26;
  const lines = series.map(x => { const g = x.rows.filter(r => ["WIN", "LOSS", "PUSH"].includes(r.result)).sort((a, b) => (rowDay(a) + (a.at || a.time || "")).localeCompare(rowDay(b) + (b.at || b.time || "")));
    let c = 0; return { ...x, pts: x.s.net == null ? [] : [0, ...g.map(r => (c += x.s.pl(r) || 0))] }; }).filter(x => x.pts.length > 1);
  if (!lines.length) return `<p class="game" style="margin:6px 0 0">The chart starts after your first graded pick.</p>`;
  const all = lines.flatMap(x => x.pts), lo = Math.min(0, ...all), hi = Math.max(0, ...all), span = hi - lo || 1, n = Math.max(...lines.map(x => x.pts.length)) - 1 || 1;
  const X = i => P + i * (W - 2 * P) / n, Y = v => H - P - (v - lo) * (H - 2 * P) / span;
  return `<div class="legend">${lines.map(x => `<span><i style="background:${x.color}"></i>${E(x.name)}</span>`).join("")}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Units chart">
    <line x1="${P}" x2="${W - P}" y1="${Y(0)}" y2="${Y(0)}" stroke="rgba(143,176,204,.35)" stroke-dasharray="4 4"/>
    ${lines.map(x => { const d = x.pts.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join(" "), last = x.pts[x.pts.length - 1], lx = Math.min(W - 34, X(x.pts.length - 1));
      return `<path d="${d} L ${X(x.pts.length - 1)} ${Y(0)} L ${X(0)} ${Y(0)} Z" fill="${x.color}" opacity=".10"/><path d="${d}" fill="none" stroke="${x.color}" stroke-width="2.6" stroke-linejoin="round" style="filter:drop-shadow(0 0 4px ${x.color})"/>
      <rect x="${lx - 30}" y="${Math.max(2, Y(last) - 22)}" width="60" height="18" rx="5" fill="${x.color}"/><text x="${lx}" y="${Math.max(2, Y(last) - 22) + 13}" text-anchor="middle" font-size="12" font-weight="800" fill="#04140a" font-family="Saira">${sgn(last)}</text>`; }).join("")}</svg>`;
}

function card(title, icon, cls, s, empty, extra) {
  return `<div class="box rc ${cls}"><h3>${ICON.ui(icon)}${title}</h3>${empty ? empty : `
    <div class="row"><span>W-L-P</span><b>${s.w}-${s.l}-${s.push}</b></div>
    <div class="row"><span>Win rate</span><b>${s.n ? (100 * s.wr).toFixed(1) + "%" : "—"}</b></div>
    <div class="row"><span>Units</span><b class="${s.net > 0 ? "pos" : s.net < 0 ? "neg" : ""}">${s.n ? sgn(s.net) : "—"}</b></div>
    <div class="row"><span>ROI</span><b class="${s.roi > 0 ? "pos" : s.roi < 0 ? "neg" : ""}">${s.n ? pct(s.roi) : "—"}</b></div>`}${extra || ""}</div>`;
}

function tierBars(rows, kind) {
  const st = TIERS.map(t => mineS(rows.filter(r => r.tier === t)));
  const max = kind === "wr" ? 1 : Math.max(1, ...st.map(s => Math.abs(s.net)));
  // bar heights in px (10/17: a % height inside the flex column was squeezed to the same size for every tier, so 45% and
  // 61% drew identical bars); 90px = the full bar, never shrunk
  return `<div class="bars">${TIERS.map((t, i) => { const s = st[i], v = kind === "wr" ? s.wr : s.net, h = s.n ? Math.max(4, Math.abs(v) / max * 90) : 3;
    return `<div><span class="v" style="color:${kind === "units" && v < 0 ? "#f87171" : "#e8f4ff"}">${s.n ? (kind === "wr" ? (100 * v).toFixed(0) + "%" : sgn(v)) : "—"}</span>
      <i style="height:${h.toFixed(0)}px;flex:none;background:linear-gradient(180deg,${TCOL[t]},${TCOL[t]}88);box-shadow:0 0 12px ${TCOL[t]}88"></i>
      <span class="lb" style="color:${TCOL[t]}">${ICON.tier(t)}${t}<small>${s.w}-${s.l}-${s.push}</small></span></div>`; }).join("")}</div>`;
}

function table(rows, keyFn, keys, label) {
  const groups = keys.map(k => [k, rows.filter(r => keyFn(r) === k)]).filter(([, rs]) => rs.length);
  if (!groups.length) return `<p class="game">No picks in this range.</p>`;
  return `<div style="overflow-x:auto"><table class="rt"><tr><th>${label}</th><th>W-L-P</th><th>WIN %</th><th>UNITS</th><th>ROI</th></tr>` + groups.map(([k, rs]) => { const s = mineS(rs);
    return `<tr><td style="white-space:nowrap">${label === "SPORT" ? ICON.sport(k) + " " : label === "TIER" ? ICON.tier(k) + " " : ""}${E(k)}</td><td>${s.w}-${s.l}-${s.push}</td><td>${s.n ? (100 * s.wr).toFixed(1) + "%" : "—"}</td>
      <td class="${s.net > 0 ? "pos" : s.net < 0 ? "neg" : ""}">${sgn(s.net)}</td><td class="${s.roi > 0 ? "pos" : s.roi < 0 ? "neg" : ""}">${s.n ? pct(s.roi) : "—"}</td></tr>`; }).join("") + `</table></div>`;
}

// CMMG RECORD - MasterHub's numbers as sent (StatsBlock: wins/losses/pushes/profit/win_rate/roi/record), never re-priced
const HPERS = [["today", "Today"], ["week", "Week"], ["month", "Month"], ["all", "All Time"]];
function hubTab() {
  const list = (HUB && HUB[HVIEW]) || [], rows = list.map(e => [e, e.periods && e.periods[HPER]]).filter(([, b]) => b);
  const at = HUB_AT ? new Date(HUB_AT).toLocaleString("en-US", { timeZone: "America/Chicago", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " CT" : "";
  const chips = (arr, cur, attr) => arr.map(([k, l]) => `<button data-${attr}="${k}" class="${k === cur ? "on" : ""}">${l}</button>`).join("");
  return `<div class="rng">${chips([["sports", "By Sport"], ["pages", "By Page"]], HVIEW, "hview")}</div>
    <div class="rng">${chips(HPERS, HPER, "hper")}</div>
    <div class="box"><h3>${ICON.ui("shield")}CMMG RECORD · ${HVIEW === "sports" ? "BY SPORT" : "BY PAGE"}</h3>
    <p class="game" style="margin:0 0 8px">Straight from MasterHub - the same numbers each page shows${HUB.through ? ` · session ${E(nice(HUB.through))}` : ""}${at ? ` · updated ${E(at)}` : ""}.${HPER === "week" ? " Week = last 7 days." : HPER === "month" ? " Month = last 30 days." : ""}</p>
    ${rows.length ? `<div style="overflow-x:auto"><table class="rt hubt"><tr><th>${HVIEW === "sports" ? "SPORT" : "PAGE"}</th><th>W-L-P</th><th>WIN %</th><th>UNITS</th><th>ROI</th></tr>` + rows.map(([e, b]) => `<tr>
      <td style="white-space:nowrap">${HVIEW === "sports" ? ICON.sport(e.key) + " " : ""}${E(e.label || e.key)}</td><td>${E(b.record || `${b.wins}-${b.losses}`)}</td>
      <td>${b.wins + b.losses ? Number(b.win_rate).toFixed(1) + "%" : "—"}</td>
      <td class="${b.profit > 0 ? "pos" : b.profit < 0 ? "neg" : ""}">${sgn(b.profit)}</td>
      <td class="${b.roi > 0 ? "pos" : b.roi < 0 ? "neg" : ""}">${b.wins + b.losses ? (b.roi > 0 ? "+" : "") + Number(b.roi).toFixed(1) + "%" : "—"}</td></tr>`).join("") + `</table></div>`
      : `<p class="game">No graded picks ${HPER === "today" ? "yet today" : "in this window"}.</p>`}</div>`;
}

// MEMBERS (owner) - the relay's tally: w/l/p/pending, net = units at each member's own odds, risk = units risked
const tl = t => `${t.w}-${t.l}-${t.p}`, wrS = t => t.w + t.l ? (100 * t.w / (t.w + t.l)).toFixed(1) + "%" : "—";
const roiS = t => t.risk ? pct(t.net / t.risk) : "—", cls = n => n > 0 ? "pos" : n < 0 ? "neg" : "";
function membersTab() {
  const m = MEM, chips = [["over", "Overview"], ["picks", "Most Taken"], ["share", `Sharing (${m.shared})`]]
    .map(([k, l]) => `<button data-mview="${k}" class="${k === MVIEW ? "on" : ""}">${l}</button>`).join("");
  let body = "";
  const few = !m.enough ? `<div class="box"><p class="game" style="margin:0">Anonymous totals show once ${Number(m.min) || 5} members are tracking (${m.tracking} now) - with fewer, they could point at one person. Members who share are under Sharing.</p></div>` : "";
  if (few && MVIEW !== "share") body = few;
  else if (MVIEW === "over") {
    body = `<div class="box"><h3>${ICON.ui("star")}MEMBERS · ANONYMOUS TOTALS</h3>
      <p class="game" style="margin:0 0 8px">What members mark with "I Took This Pick", at their own odds - no names.</p>
      <div class="row"><span>Members tracking</span><b>${m.tracking}</b></div>
      <div class="row"><span>"I play every CMMG pick" on</span><b>${m.auto}</b></div>
      <div class="row"><span>Picks marked</span><b>${m.marks}</b></div>
      <div class="row"><span>Combined W-L-P</span><b>${tl(m.combined)}${m.combined.pending ? ` · ${m.combined.pending} pending` : ""}</b></div>
      <div class="row"><span>Win rate</span><b>${wrS(m.combined)}</b></div>
      <div class="row"><span>Units (their odds)</span><b class="${cls(m.combined.net)}">${sgn(m.combined.net)}</b></div>
      <div class="row"><span>ROI</span><b class="${cls(m.combined.net)}">${roiS(m.combined)}</b></div></div>
      <div class="box"><h3>BY SPORT</h3>${m.sports.length ? `<div style="overflow-x:auto"><table class="rt hubt"><tr><th>SPORT</th><th>W-L-P</th><th>WIN %</th><th>UNITS</th><th>ROI</th></tr>` +
        m.sports.map(x => `<tr><td>${ICON.sport(x.sport)} ${E(x.sport)}</td><td>${tl(x)}</td><td>${wrS(x)}</td><td class="${cls(x.net)}">${sgn(x.net)}</td><td class="${cls(x.net)}">${roiS(x)}</td></tr>`).join("") + `</table></div>` : `<p class="game">No marked picks yet.</p>`}</div>`;
  } else if (MVIEW === "picks") {
    body = `<div class="box"><h3>MOST TAKEN</h3><p class="game" style="margin:0 0 8px">How many members marked each pick${m.distinct > m.picks.length ? ` - top ${m.picks.length} of ${m.distinct}` : ""}.</p>
      ${m.picks.length ? `<div style="overflow-x:auto"><table class="rt hubt"><tr><th>DATE</th><th>PICK</th><th>RESULT</th><th>MEMBERS</th></tr>` + m.picks.map(x => `<tr>
        <td>${E(nice(x.date))}</td><td>${ICON.sport(x.sport)} <b>${E(x.bet || "pick")}</b><div class="game">${E(x.game)}</div></td>
        <td><span class="res ${E(x.result)}">${E(x.result)}</span></td><td><b>${Number(x.n) || 0}</b></td></tr>`).join("") + `</table></div>` : `<p class="game">No marked picks yet.</p>`}</div>`;
  } else {
    body = `<div class="box"><h3>SHARING MEMBERS</h3><p class="game" style="margin:0 0 8px">Only members who ticked "Share my tracker with CMMG". Everyone else stays private. Records are the picks they marked by hand ("I play every CMMG pick" rows are the CMMG record and are not repeated here).</p>
      ${m.sharers.length ? m.sharers.map((x, i) => `<div class="row" style="cursor:pointer" data-mopen="${i}"><span><b>${E(x.name)}</b> <small class="game">sharing since ${E(nice(String(x.since).slice(0, 10)))}</small></span>
        <b class="${cls(x.record.net)}">${tl(x.record)} · ${sgn(x.record.net)}u</b></div>` + (MOPEN === String(i) ? `<div style="overflow-x:auto;margin:4px 0 10px"><table class="rt hubt"><tr><th>DATE</th><th>PICK</th><th>ODDS</th><th>UNITS</th><th>RESULT</th><th>+/-</th></tr>` +
          x.rows.map(r => `<tr><td>${E(nice(r.date))}</td><td>${ICON.sport(r.sport)} ${E(r.bet || "pick")}<div class="game">${E(r.game)}</div></td><td>${E(odds(r.odds))}</td><td>${E(r.units)}</td>
          <td><span class="res ${E(r.result)}">${E(r.result)}</span></td><td class="${cls(r.units_pl)}">${r.units_pl == null ? "" : sgn(r.units_pl)}</td></tr>`).join("") + `</table></div>` : "")).join("")
        : `<p class="game">Nobody is sharing yet.</p>`}</div>`;
  }
  return `<div class="rng">${chips}</div>${body}`;
}

function draw() {
  $("rng").style.display = TAB === "hub" || TAB === "mem" ? "none" : "";          // .rng is display:flex - [hidden] alone would not hide it
  $("tabs").innerHTML = [...(HUB ? [["hub", "CMMG Record"]] : []), ...(MEM ? [["mem", "Members"]] : []), ["over", "Overview"], ["sport", "By Sport"], ["tier", "By Tier"], ["type", "By Bet Type"], ["hist", "History"]].map(([k, l]) => `<button data-tab="${k}" class="${k === TAB ? "on" : ""}">${l}</button>`).join("");
  $("rng").innerHTML = [["7", "7D"], ["30", "30D"], ["90", "90D"], ["ytd", "YTD"], ["all", "All Time"]].map(([k, l]) => `<button data-rng="${k}" class="${k === RNG ? "on" : ""}">${l}</button>`).join("");
  const el = $("body");
  if (!CMMG.session()) { el.innerHTML = `<div class="empty">Sign in with Discord to see your Performance Lab.<br><br><button class="btn disc" data-signin>Continue with Discord</button></div>`; return; }
  if (TAB === "hub" && HUB) { el.innerHTML = hubTab(); return; }
  if (TAB === "mem" && MEM) { el.innerHTML = membersTab(); return; }
  if (TAB === "hub" || TAB === "mem") TAB = "over";
  const rows = ROWS.filter(r => inRange(rowDay(r)));
  if (TAB === "over") {
    const me = mineS(rows), all = CM && CM.published ? (CM.picks || []).filter(p => inRange(p.date)) : null;
    const cmRows = all ? CMMG.byNeed(all, "pro") : null, frRows = all ? CMMG.byNeed(all, "free") : null;   // two records, never summed
    const early = CM && CM.published ? CMMG.earliest(CM.picks || []) : "", from = rangeStart();
    const fs = frRows ? cmmgS(frRows) : null;
    const extra = cmRows ? `${early && (!from || from < early) ? `<p class="game" style="margin:8px 0 0">CMMG results on record from ${E(nice(early))}.</p>` : ""}
      <p class="game" style="margin:6px 0 0">Free Pick (its own record): <b>${fs.w}-${fs.l}-${fs.push}</b> · ${fs.n && fs.net != null ? sgn(fs.net) + "u" : "—"}</p>` : "";
    // what YOUR side holds (Scott 10/17 "pretty sure my tracker is off on its data"): with "I play every CMMG pick" it is
    // Pro Track + the Free Pick together, so it never equals the Pro-only CMMG card; and the automatic rows only reach
    // back to the feed's oldest graded day - say both instead of letting the numbers look wrong.
    const autoN = rows.filter(r => r.auto).length, freeN = rows.filter(r => r.need === "free").length;
    const youX = AUTO_SINCE ? `<p class="game" style="margin:8px 0 0">Counting every CMMG pick automatically${from && from < AUTO_SINCE || !from ? ` from ${E(nice(AUTO_SINCE))}` : ""} (${autoN} in range)${freeN ? " · includes the Free Pick, so it won't match the Pro Track card" : ""}.</p>` : "";
    el.innerHTML = `<div class="two">${card("YOUR RESULTS", "star", "you", me, "", youX)}${card("CMMG PRO TRACK", "shield", "cm", cmRows ? cmmgS(cmRows) : null,
        cmRows ? "" : `<div class="lock2"><b>Goes live soon</b>CMMG's verified record appears here once Verified Results launches.</div>`, extra)}</div>
      <div class="box"><h3>UNITS PROFIT CHART</h3>${chart([{ name: "Your units", color: "#22c55e", rows, s: me }, ...(cmRows ? [{ name: "CMMG units", color: "#3b82f6", rows: cmRows, s: cmmgS(cmRows) }] : [])])}</div>
      <div class="two"><div class="box"><h3>WIN RATE BY TIER</h3>${tierBars(rows, "wr")}</div><div class="box"><h3>UNITS BY TIER</h3>${tierBars(rows, "units")}</div></div>`;
  } else if (TAB === "sport") {
    el.innerHTML = `<div class="box"><h3>SPORT BREAKDOWN</h3>${table(rows, r => r.sport || "Other", [...new Set(rows.map(r => r.sport || "Other"))].sort(), "SPORT")}</div>`;
  } else if (TAB === "tier") {
    el.innerHTML = `<div class="box"><h3>TIER BREAKDOWN</h3>${table(rows, r => r.tier || "—", TIERS, "TIER")}</div><div class="two"><div class="box"><h3>WIN RATE BY TIER</h3>${tierBars(rows, "wr")}</div><div class="box"><h3>UNITS BY TIER</h3>${tierBars(rows, "units")}</div></div>`;
  } else if (TAB === "type") {
    el.innerHTML = `<div class="box"><h3>YOUR BET TYPES</h3>${table(rows, r => betType(r.bet), ["Moneyline", "Spread", "Total", "Player Prop", "Other"], "BET TYPE")}</div>`;
  } else {
    const opt = (id, cur, vals, all) => `<select data-hf="${id}"><option value="">${all}</option>${vals.map(v => `<option ${v === cur ? "selected" : ""}>${E(v)}</option>`).join("")}</select>`;
    const hr = rows.filter(r => (!HF.sport || r.sport === HF.sport) && (!HF.tier || r.tier === HF.tier) && (!HF.type || betType(r.bet) === HF.type))
      .sort((a, b) => (rowDay(b) + (b.at || "")).localeCompare(rowDay(a) + (a.at || "")));
    el.innerHTML = `<div class="box"><div class="hf">${opt("sport", HF.sport, [...new Set(ROWS.map(r => r.sport).filter(Boolean))].sort(), "All sports")}${opt("tier", HF.tier, TIERS, "All tiers")}${opt("type", HF.type, ["Moneyline", "Spread", "Total", "Player Prop", "Other"], "All bet types")}</div>
      ${hr.length ? `<div style="overflow-x:auto"><table class="rt"><tr><th>DATE</th><th>SPORT</th><th>PICK</th><th>TIER</th><th>RESULT</th><th>UNITS</th><th></th></tr>` + hr.map(r => `<tr>
        <td style="white-space:nowrap">${E(nice(rowDay(r)))}</td><td>${ICON.sport(r.sport)}</td>
        <td><b>${E(r.bet || "Members-only pick")}</b>${r.auto ? ' <span class="pill" title="Counted automatically (I play every CMMG pick)">AUTO</span>' : ""}<div class="game">${odds(r.myOdds)} · ${E(r.units)}u${r.myBook ? " · " + E(r.myBook) : ""}${r.note ? " · " + E(r.note) : ""}</div></td>
        <td>${r.tier ? `<span class="tag ${E(r.tier)}" style="font-size:10px;padding:2px 6px">${ICON.tier(r.tier)} ${E(r.tier)}</span>` : ""}</td>
        <td><span class="res ${E(r.result)}">${E(r.result)}</span></td>
        <td class="${r.units_pl > 0 ? "pos" : r.units_pl < 0 ? "neg" : ""}">${r.units_pl == null ? "" : sgn(r.units_pl)}</td>
        <td><button class="btn ghost" style="padding:5px 9px" data-edit="${E(r.pick)}">Edit</button></td></tr>`).join("") + `</table></div>`
        : `<p class="game">${ROWS.length ? "No picks match." : "Nothing tracked yet. Tap “✓ I Took This Pick” on any pick, or tick “I play every CMMG pick” above."}</p>`}</div>`;
  }
}

async function load() {
  const s = CMMG.session(); if (!s) return draw();
  let j; try { j = await CMMG.relay({ task: "mytracker", session: s.token }); } catch (e) { j = { ok: false, error: "Couldn't reach CMMG. Try again in a minute." }; }
  if (!j.ok) { if (/sign in/.test(j.error || "")) { CMMG.signOut(); location.reload(); return; } $("body").innerHTML = `<div class="empty">${E(j.error)}</div>`; return; }
  ROWS = j.rows || []; AUTO_SINCE = j.auto ? j.auto_since || "" : "";
  { const td = todayKey(), net = ROWS.filter(r => rowDay(r) === td).reduce((x, r) => x + (r.units_pl || 0), 0);       // 💡 tip situations
    if (net < 0) SHELL.tip("losing_day"); else if (net > 0) SHELL.tip("winning_day"); }
  $("autoBox").hidden = false; $("autoAll").checked = !!j.auto;
  $("shareBox").hidden = !j.shareable; $("shareMine").checked = !!j.shared;
  try { const t = await CMMG.relay({ task: "picks", session: s.token }); if (t && t.ok && /^\d{4}-\d\d-\d\d$/.test(t.date || "")) SESSION_DAY = t.date; } catch (e) {}
  draw();
  try { const h = await CMMG.relay({ task: "hubrecords", session: s.token });
        if (h && h.ok && h.hub) { HUB = h.hub; HUB_AT = h.at || ""; if (!TAB_PICKED) TAB = "hub"; draw(); } } catch (e) {}
  try { const mm = await CMMG.relay({ task: "members", session: s.token }); if (mm && mm.ok && mm.members) { MEM = mm.members; draw(); } } catch (e) {}
  try { CM = await CMMG.relay({ task: "results" }); } catch (e) { CM = null; }
  if (CM && CM.published) draw();
}
// "I play every CMMG pick" (Scott 10/12: "all cmmg bets are as i play them always i dont have to click them all")
$("autoAll").addEventListener("change", async e => {
  const s = CMMG.session(); if (!s) return;
  e.target.disabled = true;
  try { await CMMG.relay({ task: "trackall", session: s.token, on: e.target.checked }); } catch (x) {}
  e.target.disabled = false; load();
});
$("shareMine").addEventListener("change", async e => {
  const s = CMMG.session(); if (!s) return;
  e.target.disabled = true;
  let j = null; try { j = await CMMG.relay({ task: "share", session: s.token, on: e.target.checked }); } catch (x) {}
  e.target.disabled = false;
  if (j && j.ok) { e.target.checked = !!j.shared; toast(j.shared ? "Sharing your tracker with CMMG" : "Your tracker is private again"); }
  else { e.target.checked = !e.target.checked; toast((j && j.error) || "Couldn't save. Try again."); }
});
document.addEventListener("click", e => {
  const o = e.target.closest("[data-mopen]"); if (o) { MOPEN = MOPEN === o.dataset.mopen ? "" : o.dataset.mopen; draw(); return; }
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab) { TAB = t.dataset.tab; TAB_PICKED = true; draw(); }
  if (t.dataset.hper) { HPER = t.dataset.hper; draw(); }
  if (t.dataset.hview) { HVIEW = t.dataset.hview; draw(); }
  if (t.dataset.mview) { MVIEW = t.dataset.mview; MOPEN = ""; draw(); }
  if (t.dataset.rng) { RNG = t.dataset.rng; try { localStorage.setItem("cmmg.trkrng", RNG); } catch (e) {} draw(); }
  if (t.dataset.edit) {
    EDIT = ROWS.find(r => r.pick === t.dataset.edit); if (!EDIT) return;
    const f = $("edForm"); $("edWhat").textContent = (EDIT.bet || "Members-only pick") + (EDIT.game ? " · " + EDIT.game : "");
    f.odds.value = EDIT.myOdds ?? ""; f.units.value = EDIT.units ?? 1; f.book.value = EDIT.myBook || ""; f.note.value = EDIT.note || "";
    $("ed").showModal();
  }
});
document.addEventListener("change", e => { const s = e.target.closest("[data-hf]"); if (s) { HF[s.dataset.hf] = s.value; draw(); } });
$("ed").addEventListener("close", async () => {
  const how = $("ed").returnValue; if (!EDIT || (how !== "save" && how !== "remove")) return;
  const f = $("edForm"), s = CMMG.session();
  const body = how === "remove" ? { task: "track", session: s.token, pick: EDIT.pick, remove: true }
    : { task: "track", session: s.token, pick: EDIT.pick, odds: Number(f.odds.value), units: Number(f.units.value), book: f.book.value, note: f.note.value };
  const j = await CMMG.relay(body);
  toast(j.ok ? (how === "remove" ? "Removed" : "Saved ✓") : (j.error || "Couldn't save. Try again."));
  load();
});
SHELL.mount("tracker"); load();
</script>
</body></html>
