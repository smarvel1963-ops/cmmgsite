<!doctype html>
<!-- SAVE AS: index.html · LOCATION: C:/MarvelApps/cmmgsite/app/index.html
     CMMG Sports Edge member area v1 - Today's Picks (+ My Tracker panel). Designs: C:/MasterHub/docs/cmmg_app/web/
     (#5 cards = Simple view, #6 table = Advanced view). Data: the CMMG relay (picks fed by MasterHub; access from the
     member's Discord roles - locked picks arrive WITHOUT pick/odds). Locked rules kept: tier order ICE > EDGE > FIRE,
     EDGE = 🗡️, times in CT, the book on every pick, no made-up records (records come only from the relay feed). -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's Picks · CMMG Sports Edge</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/app/manifest.webmanifest"><meta name="theme-color" content="#060d1a">
<link rel="icon" type="image/png" href="/img/lion_64.png"><link rel="apple-touch-icon" href="/img/apple_touch_180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CMMG">
</head>
<body>
<div class="layout">
  <main class="main">
    <h1>Today's CMMG Picks</h1>
    <p class="sub" id="sub">Loading…</p>
    <div class="tiles" id="tiles"></div>
    <div class="bar" id="sports"></div>
    <div class="bar">
      <span id="tiers"></span>
      <div class="seg" role="group" aria-label="View"><button data-view="simple">Simple</button><button data-view="advanced">Advanced</button></div>
    </div>
    <div id="list"></div>
  </main>

  <aside class="side">
    <div id="account"></div>
    <div id="tracker"><h3>MY TRACKER <a href="/app/tracker/" style="float:right;font-size:12px;color:var(--ice)">Open →</a></h3><div id="trk">Sign in to track the picks you take.</div></div>
    <div><h3>DISCORD COMMUNITY</h3><p style="color:var(--dim);font-size:13px;margin:0 0 10px">Talk picks with the CMMG community.</p>
      <a class="btn disc" style="display:inline-block;text-decoration:none" href="/app/community/">Community</a></div>
  </aside>
</div>

<dialog id="took"><form method="dialog" id="tookForm">
  <h3 style="margin-top:0">I took this pick</h3><p id="tookWhat" style="color:var(--dim);margin:0 0 6px"></p>
  <label>My odds (what I actually got)<input name="odds" inputmode="numeric" required></label>
  <label>Units<input name="units" inputmode="decimal" value="1" required></label>
  <label>Sportsbook (optional)<input name="book" maxlength="30"></label>
  <label>Note (optional)<input name="note" maxlength="200"></label>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn go" value="save">Save to my tracker</button><button class="btn ghost" value="cancel" formnovalidate>Cancel</button></div>
</form></dialog>
<div class="toast" id="toast"></div>

<script src="/js/cmmg.js"></script>
<script src="/js/icons.js"></script><script src="/js/shell.js"></script>
<script>
const TIER_ORDER = { ICE: 0, EDGE: 1, FIRE: 2 };                       // locked hierarchy: ICE > EDGE > FIRE
const TIER_ICON = { ICE: ICON.tier("ICE"), EDGE: ICON.tier("EDGE"), FIRE: ICON.tier("FIRE") };
// Sport icons (league logos are trademarks - Scott 10/11 "and sport logo"). Team badges = abbreviation on the team's
// own colour from the feed; real team logos only with a licence (App Store 5.2.1).
const SPORT_ICON = new Proxy({}, { get: (o, k) => ICON.sport(k) });
const sp = x => `${SPORT_ICON[String(x || "").toUpperCase()] || "🎯"} ${E(x)}`;
const hex = c => /^[0-9a-f]{6}$/i.test(c || "") ? "#" + c : "#334155";
const lum = c => { const n = parseInt((c || "334155").slice(0, 6), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000; };
const badge = t => `<span class="tb" style="background:${hex(t.color)};color:${lum(t.color) > 150 ? "#0b1220" : "#fff"};border-color:${hex(t.alt)}" title="${E(t.name)}">${E(t.abbr)}</span>`;
const matchup = p => p.teams && p.teams.length === 2 ? `<span class="mu">${badge(p.teams[0])}<i>@</i>${badge(p.teams[1])}</span>` : "";
// Sport banner sections (WEB_DESIGNS #8, Scott 10/11 "i like number 3"): one family per sport for colour + the
// CSS-drawn field / rink / pitch / court behind the section header (our own drawing - no league marks).
const FAMILY = { NFL: "fb", NCAAF: "fb", CFL: "fb", NBA: "bb", NCAAB: "bb", WNBA: "bb", NHL: "hk", MLB: "base", KBO: "base",
  NPB: "base", NCAABB: "base", MLS: "soc", SOCCER: "soc", TENNIS: "ten", UFC: "fight", MMA: "fight", GOLF: "golf" };
const fam = x => FAMILY[String(x || "").toUpperCase()] || "other";
// Grades (WEB_DESIGNS #9, Scott 10/11 "thoughts on wins and losses"): a graded card turns green / red / gold / grey with a
// big W / L / P / V badge where the button was; each sport banner gets its tally. Results only come from the feed's
// grades (MasterHub). Locked premium picks stay locked after grading (their results are VIP receipts).
const RES = { WIN: ["W", "WON"], LOSS: ["L", "LOST"], PUSH: ["P", "PUSH"], VOID: ["V", "VOID"] };
const gradeBadge = r => RES[r] ? `<div class="grade g-${r}"><span class="hex">${RES[r][0]}</span><b>${RES[r][1]}</b></div>` : "";
const sid = x => "sec-" + String(x || "other").toLowerCase().replace(/[^a-z0-9]/g, "");
const watch = p => p.tv ? `<div class="tv">${ICON.ui("tv")} ${E(p.tv)}</div>` : "";
const UPGRADE = SHELL.UPGRADE;
let PICKS = [], SPORT = "ALL", TIER = "ALL", VIEW = "simple", TOOK = null;
try { VIEW = localStorage.getItem("cmmg.view") || "simple"; } catch (e) {}
const E = CMMG.esc;
const ct = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString("en-US", { timeZone: "America/Chicago", hour: "numeric", minute: "2-digit" }) + " CT"; };
const day = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("en-US", { timeZone: "America/Chicago", weekday: "short", month: "short", day: "numeric" }); };
const odds = o => o == null || o === "" ? "" : (Number(o) > 0 ? "+" + o : String(o));
const toast = t => { const el = document.getElementById("toast"); el.textContent = t; el.style.display = "block"; setTimeout(() => el.style.display = "none", 2600); };

async function load() {
  const s = CMMG.session();
  let j;
  try { j = await CMMG.relay({ task: "picks", session: s ? s.token : undefined }); } catch (e) { j = { ok: false }; }
  if (!j.ok) { document.getElementById("sub").textContent = "Couldn't reach CMMG — try again in a minute."; return; }
  if (s && !j.me) { CMMG.signOut(); SHELL.who(); SHELL.membershipBox(document.getElementById("account")); }                     // session expired or no longer valid
  // Never show an old board as today's (Scott's standing rule: no stale picks on a page). MasterHub's day runs past
  // midnight until Scott closes it, so a board from yesterday CT still counts until 10 AM CT.
  const nowCT = new Date(new Date().toLocaleString("en-US", { timeZone: "America/Chicago" }));
  const todayCT = nowCT.toLocaleDateString("en-CA"), yday = new Date(nowCT.getTime() - 864e5).toLocaleDateString("en-CA");
  if (j.date && j.date < todayCT && !(j.date === yday && nowCT.getHours() < 10)) {
    PICKS = []; document.getElementById("sub").textContent = `Today's picks aren't posted yet · last board was ${day(j.date + "T17:00:00Z")}`; draw(); return;
  }
  PICKS = (j.picks || []).slice().sort((a, b) => (TIER_ORDER[a.tier] ?? 9) - (TIER_ORDER[b.tier] ?? 9) || String(a.time).localeCompare(String(b.time)));
  document.getElementById("sub").textContent = j.date ? `${day(j.date + "T17:00:00Z")} · picks from the CMMG models${j.at ? " · updated " + ct(j.at) : ""}` : (j.note || "No picks published yet today.");
  draw();
}

function draw() {
  const count = t => PICKS.filter(p => p.tier === t).length;
  document.getElementById("tiles").innerHTML = ["ICE", "EDGE", "FIRE"].map(t => `<div class="tile ${t.toLowerCase()}"><div class="l">${TIER_ICON[t]} ${t} PICKS</div><div class="n">${count(t)}</div></div>`).join("")
    + `<div class="tile"><div class="l">TOTAL PICKS</div><div class="n">${PICKS.length}</div></div>`;
  const sports = ["ALL", ...new Set(PICKS.map(p => p.sport).filter(Boolean))];
  document.getElementById("sports").innerHTML = sports.map(x => `<button class="chip ${x === SPORT ? "on" : ""}" data-sport="${E(x)}">${x === "ALL" ? "All Sports" : sp(x)}</button>`).join("");
  document.getElementById("tiers").innerHTML = ["ALL", "ICE", "EDGE", "FIRE"].map(x => `<button class="chip ${x === TIER ? "on" : ""}" data-tier="${x}">${x === "ALL" ? "All Picks" : TIER_ICON[x] + " " + x}</button>`).join(" ");
  document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === VIEW));
  const list = PICKS.filter(p => (SPORT === "ALL" || p.sport === SPORT) && (TIER === "ALL" || p.tier === TIER));
  const el = document.getElementById("list");
  if (!list.length) { el.innerHTML = `<div class="empty">${PICKS.length ? "No picks match these filters." : "No picks published yet today — check back soon."}</div>`; return; }
  const signedIn = !!CMMG.session();
  if (VIEW === "advanced") {
    el.innerHTML = `<table><tr><th>TIME (CT)</th><th>SPORT</th><th>MATCHUP</th><th>PICK</th><th>ODDS</th><th>BOOK</th><th>TAG</th><th></th></tr>` + list.map(p => p.locked
      ? `<tr><td>${ct(p.time)}</td><td>${sp(p.sport)}</td><td colspan="4" class="lockmsg">${ICON.ui("lock")} Premium pick — <a href="${UPGRADE}">unlock on Discord</a></td><td><span class="tag ${E(p.tier)}">${TIER_ICON[p.tier] || ""} ${E(p.tier)}</span></td><td></td></tr>`
      : `<tr><td>${ct(p.time)}${p.tv ? `<div class="game">${ICON.ui("tv")} ${E(p.tv)}</div>` : ""}</td><td>${sp(p.sport)}</td><td>${matchup(p) || ""} <span class="game">${E(p.game)}</span></td><td><b>${E(p.bet)}</b></td><td>${odds(p.odds)}</td><td>${E(p.book)}</td><td><span class="tag ${E(p.tier)}">${TIER_ICON[p.tier] || ""} ${E(p.tier)}</span></td>
         <td><button class="btn go" data-took="${E(p.id)}">I Took This</button></td></tr>`).join("") + `</table>`;
    return;
  }
  const card = p => p.locked
    ? `<div class="card locked sp-${fam(p.sport)}"><div class="when"><b>${ct(p.time)}</b><span>${sp(p.sport)}</span></div>
        <div><span class="tag ${E(p.tier)}">${TIER_ICON[p.tier] || ""} ${E(p.tier)}</span><div class="pick">Premium pick hidden</div>
        <div class="lockmsg">${ICON.ui("lock")} Members only — your access comes from your CMMG Discord membership.</div></div>
        <div class="right"><a class="btn" style="background:var(--gold);color:#241a00;text-decoration:none;display:inline-block" href="${UPGRADE}">Unlock on Discord</a></div></div>`
    : `<div class="card sp-${fam(p.sport)} ${RES[p.result] ? "graded r-" + p.result : ""}"><div class="when"><b>${RES[p.result] ? '<span class="final">FINAL</span> ' : ""}${ct(p.time)}</b><span>${p.market ? E(p.market) : sp(p.sport)}</span>${watch(p)}</div>
        <div><span class="tag ${E(p.tier)}">${TIER_ICON[p.tier] || ""} ${E(p.tier)}</span> ${p.need === "free" ? '<span class="pill">FREE PICK</span>' : ""}
          <div class="pick" style="margin-top:6px">${E(p.bet)}</div><div class="game">${matchup(p)} ${E(p.game)}</div>
          ${p.note ? `<div class="why">${E(p.note)}</div>` : ""}
          ${p.confidence ? `<div style="font-size:12px;color:var(--dim);margin-top:6px">${E(p.confidence)}% confidence<div class="conf"><i style="width:${Math.max(0, Math.min(100, Number(p.confidence)))}%"></i></div></div>` : ""}</div>
        <div class="right"><div class="odds">${odds(p.odds)}</div><div class="book">${E(p.book || "")}${p.units ? " · " + E(p.units) + "u" : ""}</div>
          ${RES[p.result] ? gradeBadge(p.result) : `<button class="btn go" style="margin-top:8px" data-took="${E(p.id)}">✓ I Took This Pick</button>`}</div></div>`;
  // one section per sport; sections ordered by their best tier, then their earliest game (list is already ICE>EDGE>FIRE, time)
  const groups = [];
  list.forEach(p => { let g = groups.find(x => x.sport === p.sport); if (!g) groups.push(g = { sport: p.sport, picks: [] }); g.picks.push(p); });
  const best = g => Math.min(...g.picks.map(p => TIER_ORDER[p.tier] ?? 9)), first = g => g.picks.map(p => String(p.time)).sort()[0];
  groups.sort((a, b) => best(a) - best(b) || first(a).localeCompare(first(b)));
  const tally = ps => {
    const n = r => ps.filter(p => !p.locked && p.result === r).length, w = n("WIN"), l = n("LOSS"), pu = n("PUSH");
    return w + l + pu ? `<span class="stally"><i class="tw">${w}W</i><i class="tl">${l}L</i><i class="tp">${pu}P</i></span>` : "";
  };
  el.innerHTML = groups.map(g => `<section class="sportsec" id="${sid(g.sport)}">
      <div class="sbanner sb-${fam(g.sport)}"><span class="sic">${SPORT_ICON[String(g.sport).toUpperCase()] || "🎯"}</span><b>${E(g.sport || "Other")}</b>
        <span class="scount">${g.picks.length} pick${g.picks.length === 1 ? "" : "s"}</span>${tally(g.picks)}</div>
      <div class="cards">${g.picks.map(card).join("")}</div></section>`).join("");
  if (!signedIn) el.insertAdjacentHTML("afterbegin", `<p style="color:var(--dim);font-size:13px">Sign in with Discord to see the picks your membership includes and to track the ones you take.</p>`);
}

async function loadTracker() {
  const s = CMMG.session(), el = document.getElementById("trk");
  if (!s) { el.textContent = "Sign in to track the picks you take."; return; }
  let j; try { j = await CMMG.relay({ task: "mytracker", session: s.token }); } catch (e) { return; }
  if (!j.ok) { el.textContent = j.error || ""; return; }
  const m = j.summary;
  el.innerHTML = `<div class="stats"><div><b>${m.tracked}</b><span>Tracked</span></div><div><b style="color:#86efac">${m.won}</b><span>Won</span></div><div><b style="color:#fca5a5">${m.lost}</b><span>Lost</span></div></div>
    <div class="row" style="margin-top:8px"><span>Net units (your odds)</span><b>${m.net_units > 0 ? "+" : ""}${m.net_units}</b></div>`
    + (j.rows.length ? j.rows.slice(0, 8).map(r => `<div class="row"><span>${E(r.bet || r.pick)}</span><span class="res ${E(r.result)}">${E(r.result)}</span></div>`).join("") : `<p style="color:var(--dim);font-size:13px">Tap “I Took This Pick” on any pick to start.</p>`);
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.sport) {
    if (VIEW === "simple" && TIER === "ALL" && t.dataset.sport !== "ALL") {        // banner sections: jump, keep the rest
      SPORT = "ALL"; draw(); document.getElementById(sid(t.dataset.sport))?.scrollIntoView({ behavior: "smooth", block: "start" }); return;
    }
    SPORT = t.dataset.sport; draw(); return;
  }
  if (t.dataset.tier) { TIER = t.dataset.tier; draw(); return; }
  if (t.dataset.view) { VIEW = t.dataset.view; try { localStorage.setItem("cmmg.view", VIEW); } catch (e) {} draw(); return; }
  if (t.dataset.took) {
    if (!CMMG.session()) { CMMG.signIn(); return; }
    TOOK = PICKS.find(p => p.id === t.dataset.took); if (!TOOK) return;
    const f = document.getElementById("tookForm");
    document.getElementById("tookWhat").textContent = `${TOOK.bet} · ${TOOK.game}`;
    f.odds.value = TOOK.odds != null ? TOOK.odds : ""; f.units.value = 1; f.book.value = TOOK.book || ""; f.note.value = "";
    document.getElementById("took").showModal();
  }
});
document.getElementById("took").addEventListener("close", async () => {
  if (document.getElementById("took").returnValue !== "save" || !TOOK) return;
  const f = document.getElementById("tookForm"), s = CMMG.session();
  const j = await CMMG.relay({ task: "track", session: s.token, pick: TOOK.id, odds: Number(f.odds.value), units: Number(f.units.value), book: f.book.value, note: f.note.value });
  toast(j.ok ? "Saved to My Tracker ✓" : (j.error || "Couldn't save — try again"));
  loadTracker();
});
SHELL.mount("picks"); load(); loadTracker();
setInterval(load, 5 * 60000);
</script>
</body>
</html>
