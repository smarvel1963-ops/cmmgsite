<!doctype html>
<!-- SAVE AS: index.html · LOCATION: C:/MarvelApps/cmmgsite/app/game/index.html
     My Game Center (storyboard page 4): one screen for a game - live scoreboard (status, clock, TV, venue), the CMMG pick
     card(s) on it (locked picks stay locked), MY pick from My Tracker (edit on the tracker page), win probability, team
     leaders, team stats, injuries. Open with ?l=NFL&id=<espn event id> (Live Scores / Schedules link here) or with no id to
     choose from today's games that carry a CMMG pick or one of my tracked picks. Data: ESPN public scoreboard + game
     summary in the browser (non-commercial terms - licensed swap is on ACTIVE_TODO); picks + tracker from the relay.
     Teams = abbreviation + team-colour badges (no logos). Refreshes every 30 s while live.
     10/17 (Scott: "it leave huge openess in middle can we slide score closer to match and use that space better"): the
     two teams and the score sit together as one cluster, and the freed width carries a period-by-period LINE SCORE
     (ESPN header competitors[].linescores: quarters / periods / innings + total). Wide: cluster | line score side by
     side; phone: stacked. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Game Center · CMMG Sports Edge</title><link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/app/manifest.webmanifest"><meta name="theme-color" content="#060d1a">
<link rel="icon" type="image/png" href="/img/lion_64.png"><link rel="apple-touch-icon" href="/img/apple_touch_180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CMMG">
<style>
.board { padding:22px; margin-bottom:14px; text-align:center; position:relative; overflow:hidden; }
.board::before { content:""; position:absolute; inset:0; background:radial-gradient(600px 200px at 50% 0%, rgba(59,169,255,.18), transparent 70%); pointer-events:none; }
.bwrap { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:22px; align-items:center; position:relative; }
@media (max-width:900px) { .bwrap { grid-template-columns:minmax(0,1fr); } }
.bt { display:grid; grid-template-columns:auto auto auto; justify-content:center; align-items:center; gap:clamp(12px, 2.4vw, 26px); position:relative; }
.ls { width:100%; border-collapse:collapse; font-size:13px; } .ls th { color:var(--dim); font-size:11px; letter-spacing:.08em; font-weight:800; padding:4px 6px; text-align:center; }
.ls td { padding:7px 6px; text-align:center; border-top:1px solid var(--line); font-family:Saira, Inter, sans-serif; font-weight:700; }
.ls td:first-child, .ls th:first-child { text-align:left; } .ls td.tot { font-size:16px; font-weight:800; color:#fff; } .ls .cur { color:#fde68a; }
.lsbox { background:rgba(5,12,24,.45); border:1px solid var(--line); border-radius:12px; padding:8px 10px; overflow-x:auto; }
.lsbox h4 { margin:0 0 4px; font-size:11px; letter-spacing:.14em; color:#9fd2ff; text-align:left; }
.side2 { display:flex; flex-direction:column; align-items:center; gap:6px; }
.side2 .tb { font-size:20px; min-width:70px; padding:12px 10px; border-width:3px; border-radius:12px; }
.side2 b { font-family:Saira; font-size:18px; } .side2 span { color:var(--dim); font-size:12px; }
.big { font-family:Saira; font-weight:800; font-size:clamp(40px, 7vw, 68px); letter-spacing:.04em; line-height:1; }
.big .lose { color:#6d86a1; }
.stat { margin-top:8px; display:inline-flex; gap:8px; align-items:center; font-weight:800; font-size:13px; letter-spacing:.08em; }
.stat .st { font-size:12px; padding:4px 9px; border-radius:7px; }
.st.in { background:#dc2626; color:#fff; box-shadow:0 0 12px rgba(220,38,38,.6); } .st.post { background:#334155; color:#e2e8f0; } .st.pre { background:#0c2a4a; color:#7fd8ff; border:1px solid rgba(127,216,255,.4); }
.meta { color:var(--dim); font-size:13px; margin-top:6px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
.wp { margin-top:16px; } .wp .bar { height:12px; border-radius:9px; overflow:hidden; display:flex; background:#1e293b; }
.wp .bar i { display:block; height:100%; } .wp .lbl { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-top:4px; }
.gc { display:grid; grid-template-columns:1fr 1fr; gap:14px; } @media (max-width:900px) { .gc { grid-template-columns:1fr; } } .gc > * { min-width:0; }
.pc { border-radius:14px; padding:14px; margin-bottom:10px; border:1px solid var(--line); background:rgba(5,12,24,.55); }
.pc .pk { font-family:Saira; font-weight:800; font-size:20px; margin:6px 0 2px; }
.tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.tabs button { background:rgba(10,22,40,.6); border:1px solid var(--line); color:var(--dim); border-radius:999px; padding:7px 14px; font-weight:800; font-size:13px; }
.tabs button.on { background:linear-gradient(180deg,#e8f4ff,#b9dcff); color:#06101f; }
.ld { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .ld > div { min-width:0; }
.ld h4 { margin:0 0 6px; font-size:12px; letter-spacing:.1em; color:#bfe6ff; }
.ld .row span:last-child { text-align:right; }
.mrow { display:grid; grid-template-columns:70px 1fr 70px; gap:4px 10px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); }
.mrow b { font-family:Saira; font-size:15px; } .mrow b:nth-of-type(2) { text-align:right; } .mrow span { grid-column:1 / -1; text-align:center; font-size:11px; color:var(--dim); margin-top:-2px; }
.mbar { display:flex; height:8px; border-radius:6px; overflow:hidden; background:#1e293b; } .mbar i { display:block; height:100%; }
.wl { font-weight:900; } .wl.W { color:#4ade80; } .wl.L { color:#f87171; } .wl.T { color:#fde047; }
.pickgame { display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; text-decoration:none; padding:10px 12px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; background:rgba(5,12,24,.55); }
</style></head>
<body>
<div class="layout wide">
  <main class="main"><div id="root"><div class="empty">Loading…</div></div></main>
</div>
<script src="/js/cmmg.js"></script><script src="/js/icons.js"></script><script src="/js/icons-color.js"></script><script src="/js/shell.js"></script>
<script>
const E = CMMG.esc, $ = id => document.getElementById(id), qs = new URLSearchParams(location.search);
const PATHS = { NFL: "football/nfl", NCAAF: "football/college-football", NBA: "basketball/nba", NCAAB: "basketball/mens-college-basketball",
  WNBA: "basketball/wnba", MLB: "baseball/mlb", NHL: "hockey/nhl", MLS: "soccer/usa.1" };
const TIER_ICON = { ICE: ICON.tier("ICE"), EDGE: ICON.tier("EDGE"), FIRE: ICON.tier("FIRE") };
const hex = c => /^[0-9a-f]{6}$/i.test(c || "") ? "#" + c : "#334155";
const lum = c => { const n = parseInt((c || "334155").slice(0, 6), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000; };
const badge = t => `<span class="tb" style="background:${hex(t.color)};color:${lum(t.color) > 150 ? "#0b1220" : "#fff"};border-color:${hex(t.alternateColor || t.alt)}">${E(t.abbreviation || t.abbr)}</span>`;
const ct = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("en-US", { timeZone: "America/Chicago", weekday: "short", hour: "numeric", minute: "2-digit" }) + " CT"; };
const odds = o => o == null || o === "" ? "" : (Number(o) > 0 ? "+" + o : String(o));
const norm = s => String(s || "").toLowerCase();
const ctDay = () => new Date().toLocaleDateString("en-CA", { timeZone: "America/Chicago" }).replace(/-/g, "");
let TAB = "match", timer = null, PICKS = [], MINE = [];

async function relayBits() {
  const s = CMMG.session();
  const [pj, mj] = await Promise.all([CMMG.relay({ task: "picks", session: s ? s.token : undefined }).catch(() => ({})),
    s ? CMMG.relay({ task: "mytracker", session: s.token }).catch(() => ({})) : Promise.resolve({})]);
  PICKS = pj && pj.ok ? pj.picks || [] : []; MINE = mj && mj.ok ? mj.rows || [] : [];
}
// a pick is on this game only if EACH team appears in its game text (non-empty names only - the summary header has no
// shortDisplayName, and "" is contained in every string)
const onGame = (txt, comps) => comps.length === 2 && comps.every(c => [c.team.displayName, c.team.shortDisplayName, c.team.nickname, c.team.location]
  .filter(n => n && n.length > 2).some(n => norm(txt).includes(norm(n))));

async function chooser() {   // no id: today's games that carry a CMMG pick or one of my picks
  await relayBits();
  const leagues = [...new Set([...PICKS.map(p => p.sport), ...MINE.map(m => m.sport)])].filter(l => PATHS[l]);
  const lists = await Promise.all(leagues.map(l => fetch(`https://site.api.espn.com/apis/site/v2/sports/${PATHS[l]}/scoreboard?dates=${ctDay()}`).then(r => r.json()).then(j => (j.events || []).map(e => ({ l, e }))).catch(() => [])));
  const rows = lists.flat().map(({ l, e }) => { const c = e.competitions[0].competitors.sort((a, b) => (a.homeAway === "away" ? 0 : 1) - (b.homeAway === "away" ? 0 : 1));
    const p = PICKS.find(x => x.sport === l && !x.locked && onGame(x.game, c)), m = MINE.find(x => x.sport === l && onGame(x.game, c));
    return (p || m) ? { l, e, c, p, m } : null; }).filter(Boolean);
  $("root").innerHTML = `<h1>My Game Center</h1><p class="sub">Pick a game: today's games with a CMMG pick or a pick you took.</p>`
    + (rows.length ? rows.map(({ l, e, c, p, m }) => `<a class="pickgame" href="?l=${l}&id=${e.id}">${ICON.sport(l)}
        <div><b>${E(c[0].team.shortDisplayName)} @ ${E(c[1].team.shortDisplayName)}</b><div class="game">${E(e.status.type.shortDetail)}${p ? ` · ${TIER_ICON[p.tier] || ""} ${E(p.bet)}` : ""}${m ? " · My pick" : ""}</div></div>
        <span class="sc" style="font-family:Saira;font-weight:800">${e.status.type.state === "pre" ? "" : `${E(c[0].score)}-${E(c[1].score)}`}</span></a>`).join("")
      : `<div class="empty">No games with a CMMG pick right now. Open any game from <a href="/app/scores/" style="color:var(--ice)">Live Scores</a>.</div>`);
}

// Period-by-period line score from the ESPN summary header (10/17). Labels: Q1-Q4/OT (basketball, football), P1-P3/OT
// (hockey), 1-9/extra innings (baseball), 1H/2H (soccer). Before the game: the box says when it starts instead.
function lineScore(l, a, h, st, sc) {
  const la = a.linescores || [], lh = h.linescores || [], played = Math.max(la.length, lh.length);
  const n = played ? Math.max(played, { MLB: 9, NHL: 3, MLS: 2 }[l] || 4) : 0;   // the full regulation grid, empty until played
  if (!sc || !n) return `<div class="lsbox"><h4>BY ${l === "MLB" ? "INNING" : l === "NHL" ? "PERIOD" : l === "MLS" ? "HALF" : "QUARTER"}</h4><p class="game" style="margin:6px 0">${sc ? "Line score not posted yet." : "Starts " + E(ct(st.date || "")) + " — the score by " + (l === "MLB" ? "inning" : "period") + " shows here."}</p></div>`;
  const lab = i => l === "MLB" ? String(i + 1) : l === "NHL" ? (i < 3 ? "P" + (i + 1) : i === 3 ? "OT" : "SO") : l === "MLS" ? (i < 2 ? (i + 1) + "H" : "ET") : (i < 4 ? "Q" + (i + 1) : "OT" + (i > 4 ? i - 3 : ""));
  const v = (arr, i) => arr[i] ? E(arr[i].displayValue ?? arr[i].value ?? "") : "";
  const cur = st.state === "in" ? n - 1 : -1;
  const row = (c, arr) => `<tr><td>${badge({ ...c.team, abbr: c.team.abbreviation })}</td>${Array.from({ length: n }, (_, i) => `<td class="${i === cur ? "cur" : ""}">${v(arr, i)}</td>`).join("")}<td class="tot">${E(c.score)}</td></tr>`;
  return `<div class="lsbox"><h4>BY ${l === "MLB" ? "INNING" : l === "NHL" ? "PERIOD" : l === "MLS" ? "HALF" : "QUARTER"}</h4><table class="ls"><tr><th></th>${Array.from({ length: n }, (_, i) => `<th>${lab(i)}</th>`).join("")}<th>T</th></tr>${row(a, la)}${row(h, lh)}</table></div>`;
}

async function game(l, id) {
  const path = PATHS[l]; if (!path) { $("root").innerHTML = `<div class="empty">Unknown league.</div>`; return; }
  let j; try { j = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/${path}/summary?event=${encodeURIComponent(id)}`)).json(); } catch (e) { j = null; }
  if (!j || !j.header) { $("root").innerHTML = `<div class="empty">Couldn't load this game. Try again in a minute.</div>`; return; }
  if (!PICKS.length && !MINE.length) await relayBits();
  const comp = j.header.competitions[0], st = comp.status.type, cs = comp.competitors.slice().sort((a, b) => (a.homeAway === "away" ? 0 : 1) - (b.homeAway === "away" ? 0 : 1));
  const [a, h] = cs, live = st.state === "in", sc = st.state !== "pre";
  if (live) { const gm = SHELL.tipGame(l, comp.status.period, Number(a.score) - Number(h.score)); SHELL.tip(gm || "live", l); }   // 💡 tip situations
  if (live) {                                       // MOMENTUM EXPLOSION research alert (pace vs the posted total) - pop-ups switch
    const ou = Number(((j.pickcenter || []).find(x => x && x.overUnder != null) || {}).overUnder);
    SHELL.momentum({ id: l + "_" + id, league: l, line: ou, points: Number(a.score) + Number(h.score), period: comp.status.period, clock: comp.status.displayClock,
      game: `${a.team.abbreviation} @ ${h.team.abbreviation}`, status: st.shortDetail || "" });
  }
  const picks = PICKS.filter(p => p.sport === l && (p.locked ? false : onGame(p.game, cs)));
  const mine = MINE.filter(m => m.sport === l && onGame(m.game, cs));
  const tv = [...new Set((comp.broadcasts || []).map(b => b.media?.shortName).filter(Boolean))].join(", ");
  const wp = (j.winprobability || []).slice(-1)[0];
  const rec = c => (c.record || [])[0]?.summary || (c.record || [])[0]?.displayValue || "";
  const t = c => ({ ...c.team, abbr: c.team.abbreviation });
  let html = `<p style="margin:0 0 10px"><a href="/app/scores/" style="color:var(--ice);font-size:13px">← Live Scores</a></p>
    <div class="box board"><div class="bwrap"><div><div class="bt">
      <div class="side2">${badge(t(a))}<b>${E(a.team.shortDisplayName)}</b><span>${E(rec(a))}</span></div>
      <div><div class="big">${sc ? `<span class="${h.winner ? "lose" : ""}">${E(a.score)}</span> - <span class="${a.winner ? "lose" : ""}">${E(h.score)}</span>` : "vs"}</div>
        <div class="stat"><span class="st ${st.state}">${live ? "LIVE" : st.state === "post" ? "FINAL" : "UPCOMING"}</span>${E(live ? st.shortDetail : st.state === "pre" ? ct(comp.date) : st.shortDetail)}</div></div>
      <div class="side2">${badge(t(h))}<b>${E(h.team.shortDisplayName)}</b><span>${E(rec(h))}</span></div></div>
      <div class="meta">${ICON.sport(l)} ${E(l)}${tv ? `<span>${ICON.ui("tv")} ${E(tv)}</span>` : ""}${j.gameInfo?.venue?.fullName ? `<span>${ICON.ui("stadium")} ${E(j.gameInfo.venue.fullName)}</span>` : ""}</div>
      ${wp ? `<div class="wp"><div class="bar"><i style="width:${(100 - wp.homeWinPercentage * 100).toFixed(1)}%;background:${hex(a.team.color)}"></i><i style="width:${(wp.homeWinPercentage * 100).toFixed(1)}%;background:${hex(h.team.color)}"></i></div>
        <div class="lbl"><span>${E(a.team.abbreviation)} ${(100 - wp.homeWinPercentage * 100).toFixed(0)}%</span><span>Win probability</span><span>${(wp.homeWinPercentage * 100).toFixed(0)}% ${E(h.team.abbreviation)}</span></div></div>` : ""}
      </div>${lineScore(l, a, h, { ...st, date: comp.date }, sc)}</div>
    </div><div class="gc"><div>`;
  html += `<div class="box"><h3>CMMG PICK</h3>${picks.length ? picks.map(p => `<div class="pc"><span class="tag ${E(p.tier)}">${TIER_ICON[p.tier] || ""} ${E(p.tier)}</span>
      <div class="pk">${E(p.bet)}</div><div class="game">${E(p.market || "")} · ${odds(p.odds)} · ${E(p.book || "")}${p.units ? " · " + E(p.units) + "u" : ""}</div>
      ${p.result ? `<div style="margin-top:8px"><span class="rb ${E(p.result)}" style="padding:4px 10px;border-radius:7px;font-weight:900">${E(p.result)}</span></div>` : SHELL.took(p)}</div>`).join("")
      : `<p style="color:var(--dim);font-size:13px;margin:0">No CMMG pick you can see on this game.${PICKS.some(p => p.locked && p.sport === l) ? ` Members-only ${E(l)} picks are on <a href="/app/" style="color:var(--ice)">Pro Track</a>.` : ""}</p>`}</div>`;
  html += `<div class="box"><h3>MY PICK</h3>${!CMMG.session() ? `<p style="color:var(--dim);font-size:13px;margin:0">Sign in to see the picks you took.</p><button class="btn disc" data-signin style="margin-top:8px">Continue with Discord</button>`
      : mine.length ? mine.map(m => `<div class="pc"><div class="pk">${E(m.bet || "Members-only pick")}</div><div class="game">My odds ${odds(m.myOdds)} · ${E(m.units)}u${m.myBook ? " · " + E(m.myBook) : ""}</div>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center"><span class="res ${E(m.result)}">${E(m.result)}</span><a class="btn ghost" style="padding:5px 10px;text-decoration:none" href="/app/tracker/">Edit pick</a></div></div>`).join("")
      : `<p style="color:var(--dim);font-size:13px;margin:0">You haven't tracked a pick on this game.</p>`}</div></div>`;
  // right column: tabs
  const leaders = (j.leaders || []).map(x => `<div><h4>${E(x.team?.abbreviation || "")}</h4>${(x.leaders || []).slice(0, 4).map(c => c.leaders?.[0] ? `<div class="row"><span>${E(c.displayName)}<div class="game">${E(c.leaders[0].athlete?.displayName || "")}</div></span><span>${E(c.leaders[0].displayValue || "")}</span></div>` : "").join("")}</div>`).join("");
  const bt = j.boxscore?.teams || [];
  const statRows = bt.length === 2 ? (bt[0].statistics || []).slice(0, 14).map((s, i) => `<tr><td>${E(s.displayValue)}</td><td style="text-align:center;color:var(--dim)">${E(s.label || s.name)}</td><td style="text-align:right">${E(bt[1].statistics?.[i]?.displayValue ?? "")}</td></tr>`).join("") : "";
  const inj = (j.injuries || []).map(x => `<div><h4>${E(x.team?.abbreviation || "")}</h4>${(x.injuries || []).slice(0, 8).map(i => `<div class="row"><span>${E(i.athlete?.displayName || "")}<div class="game">${E(i.athlete?.position?.abbreviation || "")}</div></span><span>${E(i.status || i.type?.description || "")}</span></div>`).join("") || `<p class="game">None listed</p>`}</div>`).join("");
  html += `<div><div class="box"><div class="tabs"><button data-tab="match">Matchup</button><button data-tab="lead">Leaders</button><button data-tab="stats">Team stats</button><button data-tab="inj">Injuries</button></div>
      <div data-pane="match">${matchup(j, a, h)}</div>
      <div data-pane="lead">${leaders ? `<div class="ld">${leaders}</div>` : `<p class="game">Leaders show once the game starts.</p>`}</div>
      <div data-pane="stats">${statRows ? `<table class="rt"><tr><th>${E(bt[0].team?.abbreviation || "")}</th><th style="text-align:center">STAT</th><th style="text-align:right">${E(bt[1].team?.abbreviation || "")}</th></tr>${statRows}</table>` : `<p class="game">Team stats show once the game starts.</p>`}</div>
      <div data-pane="inj">${inj ? `<div class="ld">${inj}</div>` : `<p class="game">No injury report.</p>`}</div></div></div></div>`;
  $("root").innerHTML = html; tabs();
  document.title = `${a.team.abbreviation} @ ${h.team.abbreviation} · CMMG Game Center`;
  clearTimeout(timer); if (live) timer = setTimeout(() => game(l, id), 30000);
}
// MATCHUP (design list #6): season (pregame) or game (live/final) team stats side by side as bars, recent form for both
// teams (last five), weather when ESPN has it. Sports info only - no third-party predictions or betting splits.
function matchup(j, a, h) {
  const bt = j.boxscore?.teams || [], byId = id => bt.find(t => String(t.team?.id) === String(id));
  const A = byId(a.team.id), H = byId(h.team.id), num = v => parseFloat(String(v ?? "").replace(/[,%]/g, "").split(/[-/]/)[0]);
  let cmp = "";
  if (A && H) cmp = (A.statistics || []).slice(0, 12).map((s, i) => { const hs = (H.statistics || []).find(x => x.name === s.name && x.label === s.label) || (H.statistics || [])[i] || {};
      const av = num(s.displayValue), hv = num(hs.displayValue), tot = (Math.abs(av) || 0) + (Math.abs(hv) || 0) || 1;
      return `<div class="mrow"><b>${E(s.displayValue)}</b><div class="mbar"><i style="width:${(Math.abs(av) || 0) / tot * 100}%;background:#3b82f6"></i><i style="width:${(Math.abs(hv) || 0) / tot * 100}%;background:#94a3b8"></i></div><b>${E(hs.displayValue ?? "")}</b><span>${E(s.label || s.name)}</span></div>`; }).join("");
  const form = (j.lastFiveGames || []).map(x => `<div><h4>${E(x.team?.abbreviation || "")} · LAST 5</h4>${(x.events || []).map(e => `<div class="row"><span>${e.atVs === "@" ? "@" : "vs"} ${E(e.opponent?.abbreviation || "")}</span><span><b class="wl ${E(e.gameResult)}">${E(e.gameResult)}</b> ${E(e.score || "")}</span></div>`).join("") || `<p class="game">No games yet.</p>`}</div>`).join("");
  const w = j.gameInfo?.weather;
  return `${cmp ? `<h4 style="margin:0 0 6px;font-size:12px;letter-spacing:.1em;color:#bfe6ff;display:flex;justify-content:space-between"><span>${E(a.team.abbreviation)}</span><span>${(comp => comp.status.type.state === "pre" ? "SEASON" : "THIS GAME")(j.header.competitions[0])}</span><span>${E(h.team.abbreviation)}</span></h4>${cmp}` : `<p class="game">Team comparison shows when ESPN posts it.</p>`}
    ${form ? `<div class="ld" style="margin-top:14px">${form}</div>` : ""}
    ${w ? `<div class="row" style="margin-top:10px"><span>Weather</span><b>${E(w.temperature ?? "")}°${w.displayValue ? " · " + E(w.displayValue) : ""}</b></div>` : ""}`;
}
function tabs() { document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === TAB)); document.querySelectorAll("[data-pane]").forEach(p => p.style.display = p.dataset.pane === TAB ? "" : "none"); }
document.addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { TAB = b.dataset.tab; tabs(); } });
SHELL.mount("game");
qs.get("id") && qs.get("l") ? game(qs.get("l"), qs.get("id")) : chooser();
</script>
